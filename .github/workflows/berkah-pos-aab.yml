name: Berkah POS AAB Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "pos-app/**"
      - ".github/workflows/berkah-pos-aab.yml"

permissions:
  contents: read

concurrency:
  group: berkah-pos-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate unified Flutter app and build Android App Bundle
    # GitHub-hosted runner keeps this release independent of any workstation.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pos-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Diagnose selected runner environment
        shell: bash
        run: |
          set -euxo pipefail
          printf 'Runner: %s / %s\n' "${RUNNER_NAME:-unknown}" "${RUNNER_OS:-unknown}"
          uname -a
          id
          java -version
          python3 --version
          command -v flutter || true
          command -v sdkmanager || true

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" ]]; then
            sdk_root="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" ]]; then
            sdk_root="$ANDROID_SDK_ROOT"
          else
            sdk_root="/usr/local/lib/android/sdk"
          fi
          if [[ ! -d "$sdk_root/cmdline-tools" ]]; then
            echo "::error::Android command-line tools were not found under $sdk_root." >&2
            exit 1
          fi
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$sdkmanager_path" ]]; then
            echo "::error::sdkmanager was not found in the hosted runner Android SDK." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version

      - name: Accept SDK licenses and install compile platforms
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager is the final command in this pipe; avoid treating `yes`'s
          # expected SIGPIPE after sdkmanager exits as a license-acceptance failure.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"


      - name: Install Flutter stable from official distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter-sdk.tar.xz"
          python3 - "$archive" <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import sys
          import urllib.parse
          import urllib.request

          destination = pathlib.Path(sys.argv[1])
          metadata_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          request = urllib.request.Request(metadata_url, headers={"User-Agent": "berkah-pos-ci"})
          with urllib.request.urlopen(request, timeout=30) as response:
              metadata = json.load(response)
          stable = [release for release in metadata["releases"] if release.get("channel") == "stable"]
          if not stable:
              raise SystemExit("No stable Flutter release was listed by the official release metadata.")
          release = max(stable, key=lambda item: item.get("release_date", ""))
          archive_path = release.get("archive", "")
          expected_sha256 = release.get("sha256", "").lower()
          if not archive_path.startswith("stable/linux/flutter_linux_") or not archive_path.endswith("-stable.tar.xz"):
              raise SystemExit(f"Unexpected Flutter archive path: {archive_path!r}")
          if len(expected_sha256) != 64:
              raise SystemExit("Official Flutter release metadata did not include a SHA-256 checksum.")
          archive_url = urllib.parse.urljoin("https://storage.googleapis.com/flutter_infra_release/releases/", archive_path)
          request = urllib.request.Request(archive_url, headers={"User-Agent": "berkah-pos-ci"})
          with urllib.request.urlopen(request, timeout=120) as response, destination.open("wb") as output:
              shutil.copyfileobj(response, output)
          actual_sha256 = hashlib.sha256(destination.read_bytes()).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"Flutter archive checksum mismatch: expected {expected_sha256}, got {actual_sha256}")
          print(f"Verified official Flutter stable {release.get('version', 'unknown')} ({actual_sha256})")
          PY
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version


      - name: Prepare canonical Android host
        run: bash tool/prepare_android_host.sh

      - name: Validate app identity and forbidden client secrets
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "id.co.berkahtigaputeri.berkahpos"' android/app/build.gradle
          grep -q 'namespace = "id.co.berkahtigaputeri.berkahpos"' android/app/build.gradle
          grep -q 'targetSdk = 35' android/app/build.gradle
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|service_role|DATABASE_URL=.*PASSWORD' lib; then
            echo "Privileged server/database credentials must not be embedded in the Flutter app." >&2
            exit 1
          fi

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Configure publisher signing when secrets are present
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BERKAH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BERKAH_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BERKAH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BERKAH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/berkah-pos-upload.jks
            chmod 600 android/app/berkah-pos-upload.jks
            {
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'storeFile=app/berkah-pos-upload.jks\n'
            } > android/key.properties
            chmod 600 android/key.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are absent; this AAB is signed with the Android debug key and is only for testing."
          fi

      - name: Require cloud configuration for publisher-signed release
        if: steps.signing.outputs.mode == 'release'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
            echo "::error::A publisher-signed SaaS release requires SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY GitHub Actions secrets; refusing to build an accidentally local-only production package."
            exit 1
          fi

      - name: Build publisher-signed AAB
        if: steps.signing.outputs.mode == 'release'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build appbundle --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY"

      - name: Build test-only debug-signed AAB
        if: steps.signing.outputs.mode == 'debug'
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        run: flutter build appbundle --release

      - name: Verify generated AAB and report certificate fingerprint
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.BERKAH_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BERKAH_UPLOAD_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab
          if [[ "${{ steps.signing.outputs.mode }}" == "release" ]]; then
            keytool -list -v -keystore android/app/berkah-pos-upload.jks \
              -storepass "$STORE_PASSWORD" \
              -alias "$KEY_ALIAS" |
              grep -E 'Alias name:|SHA256:|SHA-256:'
          fi
          {
            echo "### Berkah POS Unified App Bundle"
            echo ""
            echo "- Package: id.co.berkahtigaputeri.berkahpos"
            echo "- Version: 1.1.0 (versionCode 2)"
            echo "- Target SDK: 35"
            echo "- Output: pos-app/build/app/outputs/bundle/release/app-release.aab"
            if [[ "${{ steps.signing.outputs.mode }}" == "release" ]]; then
              echo "- Signing: configured publisher upload key; compare certificate SHA-256 with the previous accepted release before publishing"
              echo "- Artifact name: berkah-pos-unified-release-aab"
            else
              echo "- Signing: Android debug key (testing only; not for Play Console submission)"
              echo "- Artifact name: berkah-pos-unified-test-aab-debug-signed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publisher-signed AAB
        if: steps.signing.outputs.mode == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: berkah-pos-unified-release-aab
          path: pos-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload test-only AAB
        if: steps.signing.outputs.mode == 'debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: berkah-pos-unified-test-aab-debug-signed
          path: pos-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties android/app/berkah-pos-upload.jks
