name: Berkah POS AAB Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "berkah-pos-trial/**"
      - ".github/workflows/berkah-pos-aab.yml"
  push:
    branches: ["main"]
    paths:
      - "berkah-pos-trial/**"
      - ".github/workflows/berkah-pos-aab.yml"

permissions:
  contents: read

concurrency:
  group: berkah-pos-aab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate Flutter and build Android App Bundle
    runs-on: [self-hosted, Fedora]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: berkah-pos-trial
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Gradle wrapper files
        run: bash tool/prepare_gradle_wrapper.sh

      - name: Validate app identity, permissions, and forbidden integrations
        run: python3 tool/verify_project.py

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze --no-pub

      - name: Run widget tests
        run: flutter test --no-pub

      - name: Configure release signing when publisher secrets are present
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BERKAH_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BERKAH_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BERKAH_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BERKAH_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/berkah-pos-upload.jks
            chmod 600 android/app/berkah-pos-upload.jks
            {
              printf 'storePassword=%s\n' "$STORE_PASSWORD"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'storeFile=app/berkah-pos-upload.jks\n'
            } > android/key.properties
            chmod 600 android/key.properties
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug" >> "$GITHUB_OUTPUT"
            echo "::warning::Publisher signing secrets are not configured; the resulting AAB will be signed with the Android debug key and is for testing only, not Play Console upload."
          fi

      - name: Build release AAB with publisher signing key
        if: steps.signing.outputs.mode == 'release'
        run: flutter build appbundle --release

      - name: Build test AAB with debug key
        if: steps.signing.outputs.mode == 'debug'
        env:
          ORG_GRADLE_PROJECT_allowDebugReleaseSigning: "true"
        run: flutter build appbundle --release

      - name: Verify generated AAB
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/bundle/release/app-release.aab
          {
            echo "### Berkah POS App Bundle"
            echo ""
            echo "- Package: id.co.berkahtigaputeri.berkahpos"
            echo "- Target SDK: 35 (kept as explicitly requested)"
            echo "- Output: build/app/outputs/bundle/release/app-release.aab"
            if [[ "${{ steps.signing.outputs.mode }}" == "release" ]]; then
              echo "- Signing: publisher upload key"
              echo "- Artifact name: berkah-pos-release-aab"
            else
              echo "- Signing: Android debug key (testing only; not for Play Console submission)"
              echo "- Artifact name: berkah-pos-test-aab-debug-signed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publisher-signed AAB
        if: steps.signing.outputs.mode == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: berkah-pos-release-aab
          path: berkah-pos-trial/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload test-only AAB
        if: steps.signing.outputs.mode == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: berkah-pos-test-aab-debug-signed
          path: berkah-pos-trial/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties android/app/berkah-pos-upload.jks
