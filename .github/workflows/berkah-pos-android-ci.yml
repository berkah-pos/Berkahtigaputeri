name: Berkah POS Android CI

on:
  push:
    branches:
      - "fix/clone-atomic-posting-20261010"
    paths:
      - "**"
  pull_request:
    branches:
      - "fix/clone-atomic-posting-20261010"
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berkah-pos-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate app ID, SDK levels, wrapper, and permissions
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "applicationId 'id.co.berkahtigaputeri.berkahpos'" android/app/build.gradle
          grep -Fq "namespace 'id.co.berkahtigaputeri.berkahpos'" android/app/build.gradle
          grep -Fq "minSdk 24" android/app/build.gradle
          grep -Fq "versionCode 1" android/app/build.gradle
          grep -Fq "versionName '1.0.0'" android/app/build.gradle
          grep -Fq "?: '36'" android/app/build.gradle
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          if grep -RniE 'com\.android\.billingclient|midtrans|xendit|WebView' pubspec.yaml lib android/app/src/main; then
            echo "Disallowed payment/WebView reference detected."
            exit 1
          fi
          while IFS= read -r permission; do
            case "$permission" in
              android.permission.CAMERA|android.permission.BLUETOOTH|android.permission.BLUETOOTH_CONNECT|android.permission.BLUETOOTH_SCAN|android.permission.INTERNET|android.permission.ACCESS_NETWORK_STATE) ;;
              *) echo "Permission outside allowlist: $permission"; exit 1 ;;
            esac
          done < <(grep -oE 'android:name="android.permission.[^"]+"' android/app/src/main/AndroidManifest.xml | cut -d '"' -f 2)
          grep -Fq 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.permission.ACCESS_NETWORK_STATE' android/app/src/main/AndroidManifest.xml

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Reformat Dart source
        run: dart format lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build unsigned validation AAB
        run: flutter build appbundle --release

      - name: Build unsigned validation APK
        run: flutter build apk --release

      - name: Upload CI validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: berkah-pos-unsigned-validation
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
