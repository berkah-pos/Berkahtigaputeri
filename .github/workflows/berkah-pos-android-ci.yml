name: Berkah POS Android CI

on:
  push:
    branches:
      - "fix/clone-atomic-posting-20261010"
    paths:
      - "standalone-berkah-pos/**"
      - ".github/workflows/berkah-pos-android-ci.yml"
  pull_request:
    paths:
      - "standalone-berkah-pos/**"
      - ".github/workflows/berkah-pos-android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: berkah-pos-android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: standalone-berkah-pos
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify package identity and wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          grep -Fq "namespace 'id.co.berkahtigaputeri.berkahpos'" android/app/build.gradle
          grep -Fq "applicationId 'id.co.berkahtigaputeri.berkahpos'" android/app/build.gradle
          grep -Fq "?: '36'" android/app/build.gradle

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Enforce Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build validation App Bundle
        run: flutter build appbundle --release

      - name: Build validation APK
        run: flutter build apk --release

      - name: Upload unsigned validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: berkah-pos-android-ci-unsigned
          path: |
            standalone-berkah-pos/build/app/outputs/bundle/release/app-release.aab
            standalone-berkah-pos/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
