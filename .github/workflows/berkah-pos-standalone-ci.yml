name: Berkah POS Standalone Flutter CI

on:
  push:
    branches:
      - "fix/clone-atomic-posting-20261010"
    paths:
      - "standalone-berkah-pos/**"
      - ".github/workflows/berkah-pos-standalone-ci.yml"
  pull_request:
    branches:
      - "fix/clone-atomic-posting-20261010"
    paths:
      - "standalone-berkah-pos/**"
      - ".github/workflows/berkah-pos-standalone-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: standalone-berkah-pos
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate Android package and Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          test -s android/gradle/wrapper/gradle-wrapper.jar
          grep -Fq "namespace 'id.co.berkahtigaputeri.berkahpos'" android/app/build.gradle
          grep -Fq "applicationId 'id.co.berkahtigaputeri.berkahpos'" android/app/build.gradle
          grep -Fq "?: '36'" android/app/build.gradle

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test

      - name: Analyze Dart sources
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build validation Android App Bundle
        run: flutter build appbundle --release

      - name: Build validation release APK
        run: flutter build apk --release

      - name: Upload unsigned CI validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: berkah-pos-ci-validation-unsigned
          path: |
            standalone-berkah-pos/build/app/outputs/bundle/release/app-release.aab
            standalone-berkah-pos/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
