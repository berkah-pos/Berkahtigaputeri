name: 02 · UAT Infinix Release APK
on:
  push:
    branches: [main]
    paths:
      - 'pos-app/**'
      - '.github/workflows/build.yml'
      - '.gitleaksignore'
  pull_request:
    branches: [main]
    paths:
      - 'pos-app/**'
      - '.github/workflows/build.yml'
      - '.gitleaksignore'
permissions:
  contents: read
jobs:
  build:
    runs-on: [self-hosted, Fedora]
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pos-app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          podman run --rm -v "$PWD:/repo:Z" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source . --log-opts="--all" --redact -v
      - name: Verify Fedora deps
        shell: bash
        run: |
          sqlite3 --version
          podman --version
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare missing Android scaffold
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x android/gradlew || ! -f android/app/src/main/AndroidManifest.xml ]]; then
            template="${RUNNER_TEMP}/pos-android-template"
            rm -rf "$template"
            flutter create --no-pub --platforms=android --org com.berkahtigaputeri --project-name pos "$template"
            mkdir -p android
            cp -an "$template/android/." android/
            if [[ ! -f .metadata ]]; then
              cp "$template/.metadata" .metadata
            fi
          fi

          # Use Java 17 and cap Gradle memory/workers on the self-hosted laptop.
          gradle_props="android/gradle.properties"
          touch "$gradle_props"
          if grep -q '^org.gradle.jvmargs=' "$gradle_props"; then
            sed -i -E 's/-Xmx[0-9]+[kKmMgG]+/-Xmx2G/; s/-XX:MaxMetaspaceSize=[0-9]+[kKmMgG]+/-XX:MaxMetaspaceSize=1G/' "$gradle_props"
          else
            printf '%s\n' 'org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8' >> "$gradle_props"
          fi
          if grep -q '^org.gradle.java.home=' "$gradle_props"; then
            sed -i "s|^org.gradle.java.home=.*|org.gradle.java.home=$JAVA_HOME|" "$gradle_props"
          else
            printf 'org.gradle.java.home=%s\n' "$JAVA_HOME" >> "$gradle_props"
          fi
          if grep -q '^org.gradle.workers.max=' "$gradle_props"; then
            sed -i 's/^org.gradle.workers.max=.*/org.gradle.workers.max=2/' "$gradle_props"
          else
            printf '%s\n' 'org.gradle.workers.max=2' >> "$gradle_props"
          fi
          if grep -q '^org.gradle.parallel=' "$gradle_props"; then
            sed -i 's/^org.gradle.parallel=.*/org.gradle.parallel=false/' "$gradle_props"
          else
            printf '%s\n' 'org.gradle.parallel=false' >> "$gradle_props"
          fi

          test -x android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/gradle.properties
          test -f .metadata
          grep -F "org.gradle.java.home=$JAVA_HOME" android/gradle.properties
          grep -E -- '-Xmx2G' android/gradle.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage

      - name: Build unsigned AAB for pull-request validation
        if: github.event_name == 'pull_request'
        run: flutter build appbundle --release

      - name: Build unsigned split APKs for pull-request validation
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Release signing preflight
        id: release_signing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        working-directory: .
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$ANDROID_KEYSTORE_BASE64" ]] || missing+=(ANDROID_KEYSTORE_BASE64)
          [[ -n "$ANDROID_KEYSTORE_PASSWORD" ]] || missing+=(ANDROID_KEYSTORE_PASSWORD)
          [[ -n "$ANDROID_KEY_ALIAS" ]] || missing+=(ANDROID_KEY_ALIAS)
          [[ -n "$ANDROID_KEY_PASSWORD" ]] || missing+=(ANDROID_KEY_PASSWORD)

          if (( ${#missing[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release artifacts skipped. Missing GitHub Actions secrets: ${missing[*]}"
            {
              echo "## Signed release artifacts skipped"
              echo "Configure these repository Actions secrets before production releases: ${missing[*]}."
              echo "Do not commit keystores, passwords, or key.properties."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          signing_dir="${RUNNER_TEMP}/android-signing"
          install -d -m 700 "$signing_dir"
          export KEYSTORE_PATH="$signing_dir/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape(value: str) -> str:
              out = []
              for index, char in enumerate(value):
                  if char == "\\":
                      out.append("\\\\")
                  elif char == "\t":
                      out.append("\\t")
                  elif char == "\n":
                      out.append("\\n")
                  elif char == "\r":
                      out.append("\\r")
                  elif char in "=:#!":
                      out.append("\\" + char)
                  elif index == 0 and char == " ":
                      out.append("\\ ")
                  else:
                      out.append(char)
              return "".join(out)

          values = {
              "storeFile": os.environ["KEYSTORE_PATH"],
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
          }
          target = Path("pos-app/android/key.properties")
          target.write_text(
              "".join(f"{key}={escape(value)}\\n" for key, value in values.items()),
              encoding="utf-8",
          )
          os.chmod(target, 0o600)
          PY
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release app bundle
        if: steps.release_signing.outputs.ready == 'true'
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/symbols/aab

      - name: Build signed split APKs
        if: steps.release_signing.outputs.ready == 'true'
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols/apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-arm64.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/app-x86_64.apk

      - name: Verify AAB and APK signatures
        if: steps.release_signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aab="build/app/outputs/bundle/release/app-release.aab"
          verify_log="${RUNNER_TEMP}/aab-signature-check.log"
          jarsigner -verify -verbose -certs "$aab" > "$verify_log" 2>&1 || {
            tail -n 30 "$verify_log"
            exit 1
          }
          if grep -qi 'jar is unsigned' "$verify_log" || ! grep -qi 'jar verified\.' "$verify_log"; then
            tail -n 30 "$verify_log"
            echo "::error::AAB is not verifiably signed"
            exit 1
          fi

          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          for apk in build/app/outputs/flutter-apk/app-arm64.apk build/app/outputs/flutter-apk/app-x86_64.apk; do
            "$apksigner" verify --verbose --print-certs "$apk" > "$verify_log" 2>&1 || {
              cat "$verify_log"
              exit 1
            }
          done
          echo "AAB and split APK signatures verified."

      - name: Upload signed Android release artifacts
        if: steps.release_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: berkahtigaputeri-pos-signed-release
          path: |
            pos-app/build/app/outputs/bundle/release/app-release.aab
            pos-app/build/app/outputs/flutter-apk/app-arm64.apk
            pos-app/build/app/outputs/flutter-apk/app-x86_64.apk
            pos-app/build/symbols/**
          if-no-files-found: error
          retention-days: 14
