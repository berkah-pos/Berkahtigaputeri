name: 02 · UAT Infinix Release APK

on:
  push:
    paths:
      - "pos-app/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "pos-app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, btp-ci, fedora44]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pos-app

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (Gitleaks full history)
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          podman run --rm \
            -v "$PWD:/repo:Z" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source . --log-opts="--all" --redact -v

      - name: Verify Fedora native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sqlite3 --version
          test -f /usr/include/sqlite3.h
          podman --version

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify mobile toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          javac -version
          flutter --version
          sdkmanager --version
          flutter doctor -v

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          CUSTOM_GRADLE=""
          if [ -f android/app/build.gradle ]; then
            CUSTOM_GRADLE="$RUNNER_TEMP/app-build.gradle"
            cp android/app/build.gradle "$CUSTOM_GRADLE"
          fi

          rm -rf "$RUNNER_TEMP/berkahtigaputeri_android"
          flutter create \
            --platforms=android \
            --org com.berkahtigaputeri \
            --project-name pos \
            "$RUNNER_TEMP/berkahtigaputeri_android"

          rm -rf android
          cp -R "$RUNNER_TEMP/berkahtigaputeri_android/android" android

          if [ -n "$CUSTOM_GRADLE" ]; then
            rm -f android/app/build.gradle.kts
            cp "$CUSTOM_GRADLE" android/app/build.gradle
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Upload release app bundle
        uses: actions/upload-artifact@v4
        with:
          name: berkahtigaputeri-pos-release-aab
          path: pos-app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
