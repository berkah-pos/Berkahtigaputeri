name: Canonical Workbook Validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".cursor/rules/**"
      - ".github/ASD_PROMPT.md"
      - ".github/muse-instructions.md"
      - ".github/workflows/canonical-workbook-validate.yml"
      - "docs/permanent/**"
      - "config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/tests/**"
      - "app/**"
      - "bootstrap/**"
      - "database/**"
      - "routes/**"
      - "docker/**"
      - "tests/**"
      - "phpunit.xml"
      - "composer.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/check_kvm2_contract.py"
      - "scripts/check_provisioning_env_contract.py"
      - "scripts/check_provisioner_grants.py"
      - "scripts/check_central_app_grants.py"
      - ".github/workflows/kvm2-laravel-ci.yml"
      - ".github/workflows/pos-app-ci.yml"
      - ".github/workflows/phase2-tenant-grants-ci.yml"
      - "app/Console/Commands/ImportCanonicalWorkbook.php"
  push:
    branches: ["**"]
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".cursor/rules/**"
      - ".github/ASD_PROMPT.md"
      - ".github/muse-instructions.md"
      - ".github/workflows/canonical-workbook-validate.yml"
      - "docs/permanent/**"
      - "config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/tests/**"
      - "app/Console/Commands/ImportCanonicalWorkbook.php"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-workbook-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate 352-key workbook contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Lint workflow definitions including Phase 2 security CI
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="$RUNNER_TEMP/actionlint_${version}_linux_amd64.tar.gz"
          checksums="$RUNNER_TEMP/actionlint_${version}_checksums.txt"
          curl --fail --location --silent --show-error "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" --output "$archive"
          curl --fail --location --silent --show-error "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt" --output "$checksums"
          (cd "$RUNNER_TEMP" && grep "actionlint_${version}_linux_amd64.tar.gz" "$checksums" | sha256sum --check --status)
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/canonical-workbook-validate.yml .github/workflows/kvm2-laravel-ci.yml .github/workflows/pos-app-ci.yml .github/workflows/phase2-tenant-grants-ci.yml

      - name: Install isolated Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/final-pos-venv"
          "$RUNNER_TEMP/final-pos-venv/bin/python" -m pip install --disable-pip-version-check openpyxl

      - name: Run workbook exporter regression tests
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. "$RUNNER_TEMP/final-pos-venv/bin/python" -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Validate canonical workbook and Laravel manifest without writes
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/final-pos-venv/bin/python" scripts/export_workbook_for_laravel.py --validate-only
