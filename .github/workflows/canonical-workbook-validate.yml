name: Canonical Workbook Validation

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".cursor/rules/**"
      - ".github/ASD_PROMPT.md"
      - ".github/muse-instructions.md"
      - "docs/permanent/**"
      - "config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/tests/**"
      - "docs/permanent/DOC_00_CANONICAL_ARCHITECTURE_DECISION.md"
      - ".github/workflows/canonical-workbook-validate.yml"
  push:
    branches: ["**"]
    paths:
      - "AGENTS.md"
      - "README.md"
      - ".cursor/rules/**"
      - ".github/ASD_PROMPT.md"
      - ".github/muse-instructions.md"
      - "docs/permanent/**"
      - "config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/tests/**"
      - "docs/permanent/DOC_00_CANONICAL_ARCHITECTURE_DECISION.md"
      - ".github/workflows/canonical-workbook-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-workbook-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate 352-key workbook contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install isolated Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/final-pos-venv"
          "$RUNNER_TEMP/final-pos-venv/bin/python" -m pip install --disable-pip-version-check openpyxl

      - name: Test offline workbook exporter and manifest integrity
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. "$RUNNER_TEMP/final-pos-venv/bin/python" -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Export canonical manifest twice with no network path
        shell: bash
        run: |
          set -euo pipefail
          python="$RUNNER_TEMP/final-pos-venv/bin/python"
          first="$RUNNER_TEMP/canonical-manifest-first.json"
          second="$RUNNER_TEMP/canonical-manifest-second.json"
          "$python" scripts/export_workbook_for_laravel.py --output "$first"
          "$python" scripts/export_workbook_for_laravel.py --output "$second"
          cmp --silent "$first" "$second"
          echo "PASS: repeated offline exports are byte-identical"
          sha256sum "$first"
          "$python" - "$first" <<'PY'
          import json
          import sys

          from scripts.export_workbook_for_laravel import canonical_manifest_sha256

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          digest = manifest.get("manifest_sha256", "")
          assert digest == canonical_manifest_sha256(manifest), "manifest SHA-256 mismatch"
          assert len(digest) == 64, "manifest SHA-256 must be 64 hexadecimal characters"
          assert sum(manifest["counts"].values()) == 352, manifest["counts"]
          print(f"PASS: canonical manifest SHA-256 verified: {digest}")
          PY
