name: One-time Laravel 13 Composer lock resolution

on:
  push:
    branches:
      - "deps/laravel13-lock-bootstrap-20261016"
    paths:
      - "composer.json"
      - "Dockerfile.lock-bootstrap"
      - ".github/workflows/composer-lock-bootstrap.yml"

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build clean PHP 8.4 Composer resolver
        run: docker build --pull --file Dockerfile.lock-bootstrap --tag berkah-composer-resolver:ci .

      - name: Verify resolver PHP and Composer
        run: |
          set -euo pipefail
          docker run --rm berkah-composer-resolver:ci php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4) { fwrite(STDERR, "Expected PHP 8.4, got ".PHP_VERSION.PHP_EOL); exit(1); }'
          docker run --rm berkah-composer-resolver:ci composer --version

      - name: Resolve supported graph without advisory suppression
        run: |
          set -euo pipefail
          docker run --rm --volume "$GITHUB_WORKSPACE:/app" --workdir /app berkah-composer-resolver:ci \
            composer update --no-interaction --prefer-dist --no-progress --no-scripts --no-plugins
          docker run --rm --volume "$GITHUB_WORKSPACE:/app" --workdir /app berkah-composer-resolver:ci \
            composer validate --strict --no-check-publish
          docker run --rm --volume "$GITHUB_WORKSPACE:/app" --workdir /app berkah-composer-resolver:ci \
            composer audit --locked --no-interaction --format=summary

      - name: Emit lockfile for reviewed commit
        shell: bash
        run: |
          set -euo pipefail
          test -s composer.lock
          echo "LOCK_BASE64_BEGIN"
          base64 -w0 composer.lock | fold -w 3000 | sed 's/^/LOCK_BASE64:/'
          echo "LOCK_BASE64_END"
