name: Final Pos Sync (fail-closed)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-pos-sync:
    name: Final Pos Sync (fail-closed)
    runs-on: [self-hosted, Linux, X64, btp-ci, fedora44]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify system Python (Fedora 44 runner)
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 --version
          python3 - <<'PY'
          import sys
          if sys.version_info < (3, 11):
              raise SystemExit(f"Python >= 3.11 required, got {sys.version.split()[0]}")
          PY

      - name: Create isolated Python environment and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          VENV_PATH="${RUNNER_TEMP}/berkah-pos-sync-venv"
          python3 -m venv "${VENV_PATH}"
          "${VENV_PATH}/bin/python" -m pip install --disable-pip-version-check openpyxl requests
          echo "${VENV_PATH}/bin" >> "${GITHUB_PATH}"

      - name: Verify config asset exists
        shell: bash
        run: |
          set -euo pipefail
          test -f config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx
          ls -lh config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx

      - name: Validate workbook contract (always)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/sync_excel_to_supabase.py --dry-run

      - name: PR - skipping secrets check, dry-run only
        if: github.event_name == 'pull_request'
        shell: bash
        run: echo 'PR - skipping secrets check, dry-run only'

      - name: Require Supabase sync secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo '::error::Missing Supabase secrets - cannot verify sync'
            exit 1
          fi

      - name: Sync workbook-owned data to Supabase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/sync_excel_to_supabase.py

      - name: Verify remote app_config exact count is 352
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail

          headers_file="$(mktemp)"
          trap 'rm -f "$headers_file"' EXIT

          curl --fail-with-body --silent --show-error --location \
            --dump-header "$headers_file" \
            --output /dev/null \
            --get "${SUPABASE_URL%/}/rest/v1/app_config" \
            --data-urlencode 'select=key' \
            --header "apikey: ${SUPABASE_SERVICE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SERVICE_KEY}" \
            --header 'Prefer: count=exact'

          content_range="$(awk 'BEGIN{IGNORECASE=1} /^content-range:/ {gsub("\r", "", $2); print $2}' "$headers_file" | tail -n 1)"
          if [ -z "$content_range" ] || [[ "$content_range" != */* ]]; then
            echo '::error::PostgREST did not return a valid Content-Range header.'
            cat "$headers_file"
            exit 1
          fi

          actual_count="${content_range##*/}"
          if ! [[ "$actual_count" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid app_config count from Content-Range: ${content_range}"
            exit 1
          fi

          echo "Post-sync app_config count: ${actual_count}"
          if [ "$actual_count" -ne 352 ]; then
            echo "::error::Final Pos app_config count mismatch: expected exactly 352, got ${actual_count}."
            exit 1
          fi

          echo 'Post-sync verification passed: app_config count = 352.'
