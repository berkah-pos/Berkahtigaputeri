name: Independent MariaDB 11.4 Provisioner Blast-Radius Proof

on:
  push:
    branches: ["security/independent-kvm2-isolation-review-20261016"]
    paths:
      - "docker/mysql-init/10-tenant-db-privileges.sql"
      - "tests/security/provisioner-grant-blast-radius.sh"
      - ".github/workflows/independent-mariadb-provisioner-proof.yml"
  pull_request:
    branches: ["security/phase-6-kvm2-backup-budget-audit-20261016"]
    paths:
      - "docker/mysql-init/10-tenant-db-privileges.sql"
      - "tests/security/provisioner-grant-blast-radius.sh"
      - ".github/workflows/independent-mariadb-provisioner-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-provisioner-blast-radius:
    name: Red-team reproduction only (not an isolation pass)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: review-only-root-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: berkahpos_central
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      MARIADB_ROOT_PASSWORD: review-only-root-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout reviewed candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reproduce actual CREATE USER and wildcard GRANT OPTION behavior
        shell: bash
        run: bash tests/security/provisioner-grant-blast-radius.sh
