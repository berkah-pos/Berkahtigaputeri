name: KVM2 Laravel Backend CI

on:
  pull_request:
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "routes/**"
      - "tests/**"
      - "phpunit.xml"
      - "docker/**"
      - "composer.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/test_canonical_workbook_contract.py"
      - "scripts/tests/test_sync_inventory.py"
      - "scripts/check_kvm2_contract.py"
      - "scripts/check_provisioning_env_contract.py"
      - "scripts/check_central_app_grants.py"
      - ".github/workflows/kvm2-laravel-ci.yml"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - ".github/muse-instructions.md"
      - "audit/**"
      - "docs/archive/supabase-historical/**"
      - "docs/reports/**"
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "routes/**"
      - "tests/**"
      - "phpunit.xml"
      - "docker/**"
      - "composer.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/test_canonical_workbook_contract.py"
      - "scripts/tests/test_sync_inventory.py"
      - "scripts/check_kvm2_contract.py"
      - ".github/workflows/kvm2-laravel-ci.yml"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - ".github/muse-instructions.md"
      - "audit/**"
      - "docs/archive/supabase-historical/**"
      - "docs/reports/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kvm2-laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate canonical workbook and active runtime contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install isolated Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/kvm2-python-venv"
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" -m pip install --disable-pip-version-check openpyxl

      - name: Check runtime and privileged environment contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_kvm2_contract.py
          python3 scripts/check_provisioning_env_contract.py
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" scripts/export_workbook_for_laravel.py --validate-only
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" scripts/test_canonical_workbook_contract.py

  backend:
    name: Laravel backend, tenant isolation and privilege proof
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CENTRAL_DOMAINS: localhost,central.test,app.central.test
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: berkahpos_central
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify hosted MariaDB 11.4 service
        env:
          MARIADB_ROOT_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mariadb-client
          ready=false
          for ((attempt=1; attempt<=30; attempt++)); do
            if mariadb-admin --host=127.0.0.1 --port=3306 --user=root --password="$MARIADB_ROOT_PASSWORD" ping --silent >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "MariaDB 11.4 service was not reachable from the hosted runner."
            exit 1
          fi
          version="$(mariadb --host=127.0.0.1 --port=3306 --user=root --password="$MARIADB_ROOT_PASSWORD" --batch --skip-column-names --execute='SELECT VERSION()')"
          [[ "$version" == 11.4.* ]]
          echo "PASS: real MariaDB service is running version $version."

      - name: Set up PHP 8.3 and Composer v2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Prepare environment
        run: cp .env.example .env

      - name: Check PHP syntax before Composer scripts
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel Pint style checks
        run: vendor/bin/pint --test

      - name: Generate Laravel application key
        run: php artisan key:generate --force

      - name: Install workbook validator dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/kvm2-python-venv"
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" -m pip install --disable-pip-version-check openpyxl

      - name: Build validated canonical import manifest
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" scripts/export_workbook_for_laravel.py --output build/central-config-import.json
          test -s build/central-config-import.json

      - name: Confirm MariaDB client is installed
        run: mariadb --version

      - name: Create CLI provisioner and apply least-privilege grants
        env:
          PROVISIONER_INIT_HOST: 127.0.0.1
          PROVISIONER_INIT_PORT: "3306"
          MARIADB_ROOT_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
          CENTRAL_DB_PASSWORD: ci-central-${{ github.run_id }}-${{ github.run_attempt }}
          PROVISIONER_DB_PASSWORD: ci-provision-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATOR_DB_PASSWORD: ci-migrator-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          bash docker/mysql-init/00-create-provisioner.sh
          mariadb --host=127.0.0.1 --port=3306 --user=root --password="$MARIADB_ROOT_PASSWORD" < docker/mysql-init/10-tenant-db-privileges.sql

      - name: Migrate central schema and verify API routes
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: root
          CENTRAL_DB_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate --database=central --path=database/migrations/central --force
          php artisan route:list --path=api/v1

      - name: Run real MariaDB 11.4 tenant grant feature test
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: berkahpos_app
          CENTRAL_DB_PASSWORD: ci-central-${{ github.run_id }}-${{ github.run_attempt }}
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
          PROVISIONER_DB_HOST: 127.0.0.1
          PROVISIONER_DB_PORT: "3306"
          PROVISIONER_DB_DATABASE: information_schema
          PROVISIONER_DB_USERNAME: berkahpos_provisioner
          PROVISIONER_DB_PASSWORD: ci-provision-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATOR_DB_HOST: 127.0.0.1
          MIGRATOR_DB_PORT: "3306"
          MIGRATOR_DB_DATABASE: information_schema
          MIGRATOR_DB_USERNAME: berkahpos_migrator
          MIGRATOR_DB_PASSWORD: ci-migrator-${{ github.run_id }}-${{ github.run_attempt }}
        run: php artisan test --filter=TenantProvisioningMariaDbGrantsTest

      - name: Run Laravel and Phase 4 MariaDB-backed integration tests
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: berkahpos_app
          CENTRAL_DB_PASSWORD: ci-central-${{ github.run_id }}-${{ github.run_attempt }}
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
          PROVISIONER_DB_HOST: 127.0.0.1
          PROVISIONER_DB_PORT: "3306"
          PROVISIONER_DB_DATABASE: information_schema
          PROVISIONER_DB_USERNAME: berkahpos_provisioner
          PROVISIONER_DB_PASSWORD: ci-provision-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATOR_DB_HOST: 127.0.0.1
          MIGRATOR_DB_PORT: "3306"
          MIGRATOR_DB_DATABASE: information_schema
          MIGRATOR_DB_USERNAME: berkahpos_migrator
          MIGRATOR_DB_PASSWORD: ci-migrator-${{ github.run_id }}-${{ github.run_attempt }}
        run: php artisan test

      - name: Dry-run canonical workbook import
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: berkahpos_app
          CENTRAL_DB_PASSWORD: ci-central-${{ github.run_id }}-${{ github.run_attempt }}
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
        run: php artisan config:import-workbook build/central-config-import.json --dry-run

      - name: Prove central app account has CRUD on central only
        env:
          MARIADB_ROOT_PASSWORD: ci-root-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/check_central_app_grants.py

