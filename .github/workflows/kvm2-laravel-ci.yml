name: KVM2 Laravel Backend CI

on:
  pull_request:
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "routes/**"
      - "tests/**"
      - "phpunit.xml"
      - "docker/**"
      - "composer.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/check_kvm2_contract.py"
      - ".github/workflows/kvm2-laravel-ci.yml"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - ".github/muse-instructions.md"
      - "audit/**"
      - "docs/archive/supabase-historical/**"
      - "docs/reports/**"
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "routes/**"
      - "tests/**"
      - "phpunit.xml"
      - "docker/**"
      - "composer.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/check_kvm2_contract.py"
      - ".github/workflows/kvm2-laravel-ci.yml"
      - "AGENTS.md"
      - ".cursor/rules/**"
      - ".github/muse-instructions.md"
      - "audit/**"
      - "docs/archive/supabase-historical/**"
      - "docs/reports/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: kvm2-laravel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate canonical workbook and active runtime contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install isolated Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/kvm2-python-venv"
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" -m pip install --disable-pip-version-check openpyxl

      - name: Check runtime contract and canonical 352-key workbook
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_kvm2_contract.py
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" scripts/export_workbook_for_laravel.py --validate-only

  backend:
    name: Laravel backend, tenant isolation and privilege proof
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: berkahpos_central
          MARIADB_USER: berkahpos_app
          MARIADB_PASSWORD: ci-central-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP 8.3 and Composer v2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Prepare environment
        run: cp .env.example .env

      - name: Check PHP syntax before Composer scripts
        shell: bash
        run: |
          set -euo pipefail
          find app bootstrap config database routes public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Laravel Pint style checks
        run: vendor/bin/pint --test

      - name: Generate Laravel application key
        run: php artisan key:generate --force

      - name: Install workbook validator dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/kvm2-python-venv"
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" -m pip install --disable-pip-version-check openpyxl

      - name: Build validated canonical import manifest
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/kvm2-python-venv/bin/python" scripts/export_workbook_for_laravel.py --output build/central-config-import.json
          test -s build/central-config-import.json

      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Create CLI provisioner and apply least-privilege grants
        env:
          PROVISIONER_INIT_HOST: 127.0.0.1
          PROVISIONER_INIT_PORT: "3306"
          MARIADB_ROOT_PASSWORD: ci-root-password
          TENANT_PROVISIONER_DB_PASSWORD: ci-provision-password
        shell: bash
        run: |
          set -euo pipefail
          bash docker/mysql-init/00-create-provisioner.sh
          mariadb --host=127.0.0.1 --port=3306 --user=root --password="$MARIADB_ROOT_PASSWORD" < docker/mysql-init/10-tenant-db-privileges.sql

      - name: Migrate central schema and verify API routes
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: root
          CENTRAL_DB_PASSWORD: ci-root-password
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
          TENANT_DB_DATABASE: berkahpos_central
          TENANT_DB_USERNAME: berkahpos_app
          TENANT_DB_PASSWORD: ci-central-password
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate --database=central --path=database/migrations/central --force
          php artisan route:list --path=api/v1

      - name: Run Laravel automated tests
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: berkahpos_app
          CENTRAL_DB_PASSWORD: ci-central-password
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
          TENANT_DB_DATABASE: berkahpos_central
          TENANT_DB_USERNAME: berkahpos_app
          TENANT_DB_PASSWORD: ci-central-password
        run: php artisan test

      - name: Dry-run canonical workbook import
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: berkahpos_app
          CENTRAL_DB_PASSWORD: ci-central-password
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
          TENANT_DB_DATABASE: berkahpos_central
          TENANT_DB_USERNAME: berkahpos_app
          TENANT_DB_PASSWORD: ci-central-password
        run: php artisan config:import-workbook build/central-config-import.json --dry-run

      - name: Prove app grants are database-scoped only
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os
          import re
          import subprocess
          import sys

          password = os.environ["MARIADB_ROOT_PASSWORD"]
          command = [
              "mariadb",
              "--host=127.0.0.1",
              "--port=3306",
              "--user=root",
              f"--password={password}",
              "--batch",
              "--skip-column-names",
              "--execute=SHOW GRANTS FOR 'berkahpos_app'@'%';",
          ]
          result = subprocess.run(command, capture_output=True, text=True, check=False)
          if result.returncode:
              print(result.stderr, file=sys.stderr)
              raise SystemExit(f"SHOW GRANTS failed with exit code {result.returncode}")

          grants = [line.strip() for line in result.stdout.splitlines() if line.strip()]
          for grant in grants:
              print(grant)

          app_account = re.compile(r"TO\s+[\x60']berkahpos_app[\x60']@[\x60']%[\x60']", re.IGNORECASE)
          global_grants = [
              grant for grant in grants
              if app_account.search(grant)
              and re.search(r"\bON\s+\*\.\*\s+TO\b", grant, re.IGNORECASE)
              and not re.match(r"^GRANT\s+USAGE\s+ON\s+\*\.\*\s+TO\b", grant, re.IGNORECASE)
          ]
          if global_grants:
              print("ERROR: berkahpos_app has global privileges:", file=sys.stderr)
              print("\n".join(global_grants), file=sys.stderr)
              raise SystemExit(1)

          scoped = [
              grant for grant in grants
              if app_account.search(grant)
              and "berkahpos" in grant.lower()
              and re.search(r"\bON\s+\x60?berkahpos", grant, re.IGNORECASE)
              and not re.search(r"\bON\s+\*\.\*", grant, re.IGNORECASE)
          ]
          has_central = any("central" in grant.lower() for grant in scoped)
          has_tenant = any("tenant" in grant.lower() for grant in scoped)
          if len(scoped) < 2 or not has_central or not has_tenant:
              print("ERROR: expected central and tenant-scoped grants; observed:", file=sys.stderr)
              print("\n".join(scoped) or "<none>", file=sys.stderr)
              raise SystemExit(1)
          if any("WITH GRANT OPTION" in grant.upper() for grant in scoped):
              print("ERROR: app account unexpectedly has GRANT OPTION", file=sys.stderr)
              raise SystemExit(1)
          print("PASS: berkahpos_app has central and tenant-scoped grants only; no global privileges or GRANT OPTION.")
          PY
