name: Laravel PostgreSQL 17 Baseline

on:
  pull_request:
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/migrations/central/**"
      - "database/migrations/tenant/**"
      - "routes/**"
      - "public/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
      - "docker/**"
      - "phpunit.xml"
      - ".github/workflows/laravel-pg17-baseline.yml"
      - "docs/development/**"
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/migrations/central/**"
      - "database/migrations/tenant/**"
      - "routes/**"
      - "public/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
      - "docker/**"
      - "phpunit.xml"
      - ".github/workflows/laravel-pg17-baseline.yml"
      - "docs/development/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-pg17-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg17-baseline:
    name: Locked PHP 8.4 / Laravel 13 / PostgreSQL 17 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: berkahpos_central_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d berkahpos_central_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_IMAGE: berkah-pos-platform-ci:${{ github.sha }}
      PROD_IMAGE: berkah-pos-platform-production:${{ github.sha }}
      CENTRAL_DB_HOST: 127.0.0.1
      CENTRAL_DB_PORT: "5432"
      CENTRAL_DB_DATABASE: berkahpos_central_ci
      CENTRAL_DB_USERNAME: berkahpos_central_runtime_ci
      CENTRAL_DB_PASSWORD: central-runtime-ci-only-password
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: "5432"
      TENANT_DB_DATABASE: berkahpos_tenant_ci
      TENANT_DB_USERNAME: berkahpos_tenant_runtime_ci
      TENANT_DB_PASSWORD: tenant-runtime-ci-only-password
      TENANT_DB_SSLMODE: disable
      PROVISIONER_DB_HOST: 127.0.0.1
      PROVISIONER_DB_PORT: "5432"
      PROVISIONER_DB_DATABASE: postgres
      PROVISIONER_DB_USERNAME: berkahpos_provisioner_ci
      PROVISIONER_DB_PASSWORD: provisioner-ci-only-password
      PROVISIONER_DB_SSLMODE: disable
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: central
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Assert manifest, lock, runtime and DB target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("composer.json").read_text())
          lock = json.loads(Path("composer.lock").read_text())
          require = manifest["require"]
          assert require["php"] == "^8.4"
          assert require["laravel/framework"] == "^13.0"
          assert require["filament/filament"] == "^5.0"
          assert require["laravel/sanctum"] == "^4.0"
          assert "stancl/tenancy" in require
          tenancy = next(p for p in lock["packages"] if p["name"] == "stancl/tenancy")
          assert tenancy["version"] == "v3.10.1", tenancy["version"]
          assert require.get("ext-pdo_pgsql") == "*"
          assert "ext-pdo_mysql" not in require
          assert "ext-pdo_mysql" not in lock.get("platform", {})
          db_config = Path("config/database.php").read_text()
          assert "'default' => env('DB_CONNECTION', 'central')" in db_config
          assert "'driver' => 'pgsql'" in db_config
          tenant_config_start = db_config.index("'tenant' => [")
          tenant_config_end = db_config.index("\n        ],", tenant_config_start)
          tenant_config = db_config[tenant_config_start:tenant_config_end]
          for forbidden in ["env('CENTRAL_DB_USERNAME'", "env('CENTRAL_DB_PASSWORD'", "env('DB_USERNAME'", "env('DB_PASSWORD'"]:
              assert forbidden not in tenant_config, f"tenant connection must not inherit central credentials: {forbidden}"
          assert "'database' => env('PROVISIONER_DB_DATABASE', 'postgres')" in db_config
          compose = Path("docker-compose.yml").read_text()
          assert "TENANT_DB_USERNAME: ${CENTRAL_DB_USERNAME" not in compose
          assert "TENANT_DB_PASSWORD: ${CENTRAL_DB_PASSWORD" not in compose
          for active_path in ["Dockerfile", ".env.example", "docker-compose.yml"]:
              active = Path(active_path).read_text().lower()
              assert "mariadb" not in active, active_path
              assert "mysql:" not in active, active_path
          for active_path in ["composer.json", ".env.example", "Dockerfile", "docker-compose.yml"]:
              assert "SUPABASE_" not in Path(active_path).read_text(), active_path
          print("PHP/Laravel/Filament/Sanctum/tenancy constraints and PostgreSQL-only active runtime contract: PASS")
          PY

      - name: Build PHP 8.4 CI image and install locked dependencies cleanly
        run: docker build --pull --target development --tag "$CI_IMAGE" .

      - name: Validate dependencies and keep security audit enabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$CI_IMAGE" composer validate --strict --no-check-publish
          docker run --rm --network host "$CI_IMAGE" composer check-platform-reqs
          docker run --rm --network host "$CI_IMAGE" composer audit --locked --no-interaction
          docker run --rm "$CI_IMAGE" composer show --locked laravel/framework
          docker run --rm "$CI_IMAGE" composer show --locked filament/filament
          docker run --rm "$CI_IMAGE" composer show --locked laravel/sanctum
          docker run --rm "$CI_IMAGE" composer show --locked stancl/tenancy

      - name: Create isolated restricted runtime and provisioning roles in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE berkahpos_provisioner_ci LOGIN PASSWORD 'provisioner-ci-only-password' CREATEDB CREATEROLE NOSUPERUSER NOREPLICATION NOBYPASSRLS"
          PGPASSWORD=postgres docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE berkahpos_central_runtime_ci LOGIN PASSWORD 'central-runtime-ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          PGPASSWORD=postgres docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE berkahpos_tenant_runtime_ci LOGIN PASSWORD 'tenant-runtime-ci-only-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          PGPASSWORD=postgres docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -v ON_ERROR_STOP=1 \
            -c "REVOKE ALL ON DATABASE berkahpos_central_ci FROM PUBLIC; GRANT CONNECT ON DATABASE berkahpos_central_ci TO berkahpos_central_runtime_ci"

      - name: Verify Laravel boot, API routes and feature smoke tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$CI_IMAGE" php artisan about
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$CI_IMAGE" php artisan route:list --path=api/v1

      - name: Create disposable tenant database on PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE berkahpos_tenant_ci"
          PGPASSWORD=postgres docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "REVOKE ALL ON DATABASE berkahpos_tenant_ci FROM PUBLIC; GRANT CONNECT ON DATABASE berkahpos_tenant_ci TO berkahpos_tenant_runtime_ci"

      - name: Migrate fresh central database on disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME=postgres --env CENTRAL_DB_PASSWORD=postgres "$CI_IMAGE" \
            php artisan migrate --database=central --path=database/migrations/central --force

      - name: Grant central runtime only DML and sequence privileges
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -v ON_ERROR_STOP=1 \
            -c "GRANT USAGE ON SCHEMA public TO berkahpos_central_runtime_ci; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO berkahpos_central_runtime_ci; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO berkahpos_central_runtime_ci; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO berkahpos_central_runtime_ci; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO berkahpos_central_runtime_ci"

      - name: Export validated canonical workbook manifest offline
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/berkah-workbook-venv"
          "$RUNNER_TEMP/berkah-workbook-venv/bin/python" -m pip install --disable-pip-version-check openpyxl
          mkdir -p build/import-e2e
          "$RUNNER_TEMP/berkah-workbook-venv/bin/python" scripts/export_workbook_for_laravel.py \
            --output "$PWD/build/import-e2e/canonical-manifest.json"

      - name: Import real 352-entry manifest into disposable central PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD/build/import-e2e/canonical-manifest.json:/tmp/canonical-manifest.json:ro" \
            --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD \
            "$CI_IMAGE" php artisan config:import-workbook /tmp/canonical-manifest.json

      - name: Verify real import counts and enabled service projection
        shell: bash
        run: |
          set -euo pipefail
          expected_enabled="$(python3 -c 'import json; m=json.load(open("build/import-e2e/canonical-manifest.json")); print(sum(1 for row in m["services"] if row["enabled"]))')"
          expected_active_devices="$(python3 -c 'import json; m=json.load(open("build/import-e2e/canonical-manifest.json")); print(sum(1 for row in m["devices"] if row["active"]))')"
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN
              IF (SELECT count(*) FROM global_configs) <> 1 THEN RAISE EXCEPTION 'global_configs count mismatch'; END IF;
              IF (SELECT count(*) FROM templates) <> 3 THEN RAISE EXCEPTION 'templates count mismatch'; END IF;
              IF (SELECT count(*) FROM tenants) <> 100 THEN RAISE EXCEPTION 'tenants count mismatch'; END IF;
              IF (SELECT count(*) FROM tenant_configs WHERE service_scope = '__base__') <> 100 THEN RAISE EXCEPTION 'base tenant config count mismatch'; END IF;
              IF (SELECT count(*) FROM tenant_configs WHERE service_scope IN ('pos','akuntansi')) <> 140 THEN RAISE EXCEPTION 'service config count mismatch'; END IF;
              IF (SELECT count(*) FROM tenant_services) <> 140 THEN RAISE EXCEPTION 'tenant service projection count mismatch'; END IF;
              IF (SELECT count(*) FROM device_registry) <> 108 THEN RAISE EXCEPTION 'device registry count mismatch'; END IF;
              IF (SELECT count(*) FROM device_configs) <> 108 THEN RAISE EXCEPTION 'device config count mismatch'; END IF;
              IF (SELECT count(*) FROM subscriptions) <> 100 THEN RAISE EXCEPTION 'subscription count mismatch'; END IF;
            END \$\$"
          actual_enabled="$(docker run --rm --network host --env PGPASSWORD=postgres postgres:17 psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -At -c "SELECT count(*) FROM tenant_services WHERE enabled")"
          actual_active_devices="$(docker run --rm --network host --env PGPASSWORD=postgres postgres:17 psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -At -c "SELECT count(*) FROM device_registry WHERE status = 'active'")"
          test "$actual_enabled" = "$expected_enabled"
          test "$actual_active_devices" = "$expected_active_devices"
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -At -c "SELECT 'global:' || key || ':' || version FROM global_configs UNION ALL SELECT 'template:' || id || ':' || version FROM templates UNION ALL SELECT 'tenant-config:' || tenant_id || ':' || service_scope || ':' || version FROM tenant_configs UNION ALL SELECT 'device-config:' || device_id || ':' || version FROM device_configs ORDER BY 1" > build/import-e2e/versions-before-invalid.txt

      - name: Reject malformed manifest without partial database writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/import-e2e/canonical-manifest.json").read_text(encoding="utf-8"))
          manifest["devices"][1]["device_id"] = manifest["devices"][0]["device_id"]
          Path("build/import-e2e/invalid-manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          if docker run --rm --network host \
            -v "$PWD/build/import-e2e/invalid-manifest.json:/tmp/invalid-manifest.json:ro" \
            --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD \
            "$CI_IMAGE" php artisan config:import-workbook /tmp/invalid-manifest.json; then
            echo "Invalid manifest was unexpectedly accepted" >&2
            exit 1
          fi
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -At -c "SELECT 'global:' || key || ':' || version FROM global_configs UNION ALL SELECT 'template:' || id || ':' || version FROM templates UNION ALL SELECT 'tenant-config:' || tenant_id || ':' || service_scope || ':' || version FROM tenant_configs UNION ALL SELECT 'device-config:' || device_id || ':' || version FROM device_configs ORDER BY 1" > build/import-e2e/versions-after-invalid.txt
          diff -u build/import-e2e/versions-before-invalid.txt build/import-e2e/versions-after-invalid.txt

      - name: Prove repeated canonical import is idempotent
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD/build/import-e2e/canonical-manifest.json:/tmp/canonical-manifest.json:ro" \
            --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD \
            "$CI_IMAGE" php artisan config:import-workbook /tmp/canonical-manifest.json
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -At -c "SELECT 'global:' || key || ':' || version FROM global_configs UNION ALL SELECT 'template:' || id || ':' || version FROM templates UNION ALL SELECT 'tenant-config:' || tenant_id || ':' || service_scope || ':' || version FROM tenant_configs UNION ALL SELECT 'device-config:' || device_id || ':' || version FROM device_configs ORDER BY 1" > build/import-e2e/versions-after-repeat.txt
          diff -u build/import-e2e/versions-before-invalid.txt build/import-e2e/versions-after-repeat.txt

      - name: Migrate fresh tenant database on disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD \
            --env TENANT_DB_HOST --env TENANT_DB_PORT --env TENANT_DB_DATABASE \
            --env TENANT_DB_USERNAME=postgres --env TENANT_DB_PASSWORD=postgres --env TENANT_DB_SSLMODE "$CI_IMAGE" \
            php artisan migrate --database=tenant --path=database/migrations/tenant --force

      - name: Grant tenant runtime only DML and sequence privileges
        shell: bash
        run: |
          set -euo pipefail
          PGPASSWORD=postgres docker run --rm --network host --env PGPASSWORD postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_tenant_ci -v ON_ERROR_STOP=1 \
            -c "GRANT USAGE ON SCHEMA public TO berkahpos_tenant_runtime_ci; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO berkahpos_tenant_runtime_ci; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO berkahpos_tenant_runtime_ci; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO berkahpos_tenant_runtime_ci; ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO berkahpos_tenant_runtime_ci"

      - name: Assert real PostgreSQL runtime role privileges and cross-database denial
        shell: bash
        run: bash scripts/ci/verify_pg_runtime_role_boundary.sh

      - name: Run Laravel feature and PostgreSQL schema-integrity tests on migrated PostgreSQL 17 schemas
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD \
            --env TENANT_DB_HOST --env TENANT_DB_PORT --env TENANT_DB_DATABASE \
            --env TENANT_DB_USERNAME --env TENANT_DB_PASSWORD --env TENANT_DB_SSLMODE \
            "$CI_IMAGE" php artisan test

      - name: Verify central and tenant tables exist on PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -v ON_ERROR_STOP=1 \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('tenants','domains','device_registry','tenant_configs') ORDER BY table_name"
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_tenant_ci -v ON_ERROR_STOP=1 \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('products','sales','sale_items','journal_entries','sync_receipts') ORDER BY table_name"

      - name: Execute PostgreSQL 17 non-superuser tenant provisioning and isolation tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD \
            --env PROVISIONER_DB_HOST --env PROVISIONER_DB_PORT --env PROVISIONER_DB_DATABASE \
            --env PROVISIONER_DB_USERNAME --env PROVISIONER_DB_PASSWORD --env PROVISIONER_DB_SSLMODE \
            --env RUN_POSTGRES_TENANT_PROVISIONER_INTEGRATION=1 \
            "$CI_IMAGE" php artisan test --filter=PostgresTenantProvisionerIntegrationTest

      - name: Build production image from the committed lock
        run: docker build --pull --target production --tag "$PROD_IMAGE" .

      - name: Smoke-test production image HTTP health and API route
        shell: bash
        run: |
          set -euo pipefail
          container="berkah-pos-prod-smoke-${{ github.run_id }}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" -p 127.0.0.1:8080:80 \
            --env APP_ENV=testing --env APP_DEBUG=false --env APP_KEY \
            --env DB_CONNECTION --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT \
            --env CENTRAL_DB_DATABASE --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$PROD_IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/up >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/up
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/platform-health
          docker run --rm --entrypoint composer "$PROD_IMAGE" show --locked laravel/framework
          docker run --rm --entrypoint composer "$PROD_IMAGE" show --locked filament/filament
          docker run --rm --entrypoint composer "$PROD_IMAGE" show --locked stancl/tenancy
