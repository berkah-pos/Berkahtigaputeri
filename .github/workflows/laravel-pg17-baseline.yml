name: Laravel PostgreSQL 17 Baseline

on:
  pull_request:
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/migrations/central/**"
      - "database/migrations/tenant/**"
      - "routes/**"
      - "public/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
      - "docker/**"
      - "phpunit.xml"
      - ".github/workflows/laravel-pg17-baseline.yml"
      - "docs/development/**"
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/migrations/central/**"
      - "database/migrations/tenant/**"
      - "routes/**"
      - "public/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".gitignore"
      - ".env.example"
      - "docker-compose.yml"
      - "docker/**"
      - "phpunit.xml"
      - ".github/workflows/laravel-pg17-baseline.yml"
      - "docs/development/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laravel-pg17-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pg17-baseline:
    name: Locked PHP 8.4 / Laravel 13 / PostgreSQL 17 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: berkahpos_central_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d berkahpos_central_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI_IMAGE: berkah-pos-platform-ci:${{ github.sha }}
      PROD_IMAGE: berkah-pos-platform-production:${{ github.sha }}
      CENTRAL_DB_HOST: 127.0.0.1
      CENTRAL_DB_PORT: "5432"
      CENTRAL_DB_DATABASE: berkahpos_central_ci
      CENTRAL_DB_USERNAME: postgres
      CENTRAL_DB_PASSWORD: postgres
      TENANT_DB_HOST: 127.0.0.1
      TENANT_DB_PORT: "5432"
      TENANT_DB_DATABASE: berkahpos_tenant_ci
      TENANT_DB_USERNAME: tenant_runtime_ci
      TENANT_DB_PASSWORD: tenant_runtime_ci_password
      TENANT_MIGRATOR_DB_HOST: 127.0.0.1
      TENANT_MIGRATOR_DB_PORT: "5432"
      TENANT_MIGRATOR_DB_DATABASE: berkahpos_tenant_ci
      TENANT_MIGRATOR_DB_USERNAME: tenant_migrator_ci
      TENANT_MIGRATOR_DB_PASSWORD: tenant_migrator_ci_password
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      DB_CONNECTION: central
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Assert manifest, lock, runtime and DB target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("composer.json").read_text())
          lock = json.loads(Path("composer.lock").read_text())
          require = manifest["require"]
          assert require["php"] == "^8.4"
          assert require["laravel/framework"] == "^13.0"
          assert require["filament/filament"] == "^5.0"
          assert require["laravel/sanctum"] == "^4.0"
          assert "stancl/tenancy" in require
          tenancy = next(p for p in lock["packages"] if p["name"] == "stancl/tenancy")
          assert tenancy["version"] == "v3.10.1", tenancy["version"]
          assert require.get("ext-pdo_pgsql") == "*"
          assert "ext-pdo_mysql" not in require
          assert "ext-pdo_mysql" not in lock.get("platform", {})
          db_config = Path("config/database.php").read_text()
          assert "'default' => env('DB_CONNECTION', 'central')" in db_config
          assert "'driver' => 'pgsql'" in db_config
          tenant_config = db_config.split("'tenant' => [", 1)[1].split("        ],", 1)[0]
          assert "'username' => env('TENANT_DB_USERNAME') ?: '__tenant_runtime_role_required__'" in tenant_config
          assert "'password' => env('TENANT_DB_PASSWORD', '')" in tenant_config
          assert "env('CENTRAL_DB_USERNAME'" not in tenant_config
          assert "env('DB_USERNAME'" not in tenant_config
          assert "env('CENTRAL_DB_PASSWORD'" not in tenant_config
          assert "env('DB_PASSWORD'" not in tenant_config
          assert "'tenant_migrator' => [" in db_config
          assert "TENANT_MIGRATOR_DB_USERNAME" in db_config
          assert "TENANT_DB_URL" not in db_config
          assert "TENANT_MIGRATOR_DB_URL" not in db_config
          tenant_migration = Path("database/migrations/tenant/2026_10_17_000001_create_tenant_pos_tables.php").read_text()
          assert "Schema::connection('tenant')" not in tenant_migration
          assert "Schema::connection($this->targetConnection())" in tenant_migration
          assert "Tenant POS migrations require --database=tenant or --database=tenant_migrator." in tenant_migration
          for active_path in ["Dockerfile", ".env.example", "docker-compose.yml"]:
              active = Path(active_path).read_text().lower()
              assert "mariadb" not in active, active_path
              assert "mysql:" not in active, active_path
          for active_path in ["composer.json", ".env.example", "Dockerfile", "docker-compose.yml"]:
              assert "SUPABASE_" not in Path(active_path).read_text(), active_path
          print("PHP/Laravel/Filament/Sanctum/tenancy constraints and PostgreSQL-only active runtime contract: PASS")
          PY

      - name: Build PHP 8.4 CI image and install locked dependencies cleanly
        run: docker build --pull --target development --tag "$CI_IMAGE" .

      - name: Validate dependencies and keep security audit enabled
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$CI_IMAGE" composer validate --strict --no-check-publish
          docker run --rm --network host "$CI_IMAGE" composer check-platform-reqs
          docker run --rm --network host "$CI_IMAGE" composer audit --locked --no-interaction
          docker run --rm "$CI_IMAGE" composer show --locked laravel/framework
          docker run --rm "$CI_IMAGE" composer show --locked filament/filament
          docker run --rm "$CI_IMAGE" composer show --locked laravel/sanctum
          docker run --rm "$CI_IMAGE" composer show --locked stancl/tenancy

      - name: Verify Laravel boot, API routes and feature smoke tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$CI_IMAGE" php artisan about
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$CI_IMAGE" php artisan route:list --path=api/v1

      - name: Provision disposable tenant A/B roles and databases
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE tenant_migrator_ci LOGIN NOINHERIT PASSWORD '$TENANT_MIGRATOR_DB_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE" \
            -c "CREATE ROLE tenant_runtime_ci LOGIN NOINHERIT PASSWORD '$TENANT_DB_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE" \
            -c "CREATE ROLE tenant_migrator_b_ci LOGIN NOINHERIT PASSWORD 'tenant_migrator_b_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE" \
            -c "CREATE ROLE tenant_runtime_b_ci LOGIN NOINHERIT PASSWORD 'tenant_runtime_b_ci_password' NOSUPERUSER NOCREATEDB NOCREATEROLE" \
            -c "CREATE DATABASE berkahpos_tenant_ci OWNER tenant_migrator_ci" \
            -c "CREATE DATABASE berkahpos_tenant_b_ci OWNER tenant_migrator_b_ci" \
            -c "REVOKE CONNECT ON DATABASE berkahpos_central_ci FROM PUBLIC" \
            -c "REVOKE CONNECT ON DATABASE berkahpos_tenant_ci FROM PUBLIC" \
            -c "REVOKE CONNECT ON DATABASE berkahpos_tenant_b_ci FROM PUBLIC" \
            -c "GRANT CONNECT ON DATABASE berkahpos_tenant_ci TO tenant_migrator_ci, tenant_runtime_ci" \
            -c "GRANT CONNECT ON DATABASE berkahpos_tenant_b_ci TO tenant_migrator_b_ci, tenant_runtime_b_ci"
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_tenant_ci -v ON_ERROR_STOP=1 \
            -c "REVOKE CREATE ON SCHEMA public FROM PUBLIC" \
            -c "REVOKE CREATE ON SCHEMA public FROM tenant_runtime_ci" \
            -c "GRANT USAGE ON SCHEMA public TO tenant_runtime_ci" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE tenant_migrator_ci IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO tenant_runtime_ci" \
            -c "ALTER DEFAULT PRIVILEGES FOR ROLE tenant_migrator_ci IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO tenant_runtime_ci"

      - name: Migrate fresh central database on disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$CI_IMAGE" \
            php artisan migrate --database=central --path=database/migrations/central --force

      - name: Import canonical manifest atomically into disposable central PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/workbook-import-venv"
          "$RUNNER_TEMP/workbook-import-venv/bin/python" -m pip install --disable-pip-version-check openpyxl
          manifest="$RUNNER_TEMP/canonical-central-config.json"
          "$RUNNER_TEMP/workbook-import-venv/bin/python" scripts/export_workbook_for_laravel.py --output "$manifest"
          docker run --rm --network host -v "$manifest:/tmp/canonical-central-config.json:ro" \
            --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$CI_IMAGE" \
            php artisan config:import-workbook /tmp/canonical-central-config.json
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -v ON_ERROR_STOP=1 -tA \
            -c "DO \$\$ BEGIN IF (SELECT count(*) FROM global_configs WHERE key='global') <> 1 OR (SELECT count(*) FROM templates) <> 3 OR (SELECT count(*) FROM tenants) <> 100 OR (SELECT count(*) FROM tenant_services) <> 140 OR (SELECT count(*) FROM device_registry) <> 108 OR (SELECT count(*) FROM tenant_configs) <> 240 OR (SELECT count(*) FROM device_configs) <> 108 THEN RAISE EXCEPTION 'canonical import count mismatch'; END IF; END \$\$"

      - name: Migrate fresh tenant database with isolated migrator identity
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env TENANT_MIGRATOR_DB_HOST --env TENANT_MIGRATOR_DB_PORT \
            --env TENANT_MIGRATOR_DB_DATABASE --env TENANT_MIGRATOR_DB_USERNAME \
            --env TENANT_MIGRATOR_DB_PASSWORD "$CI_IMAGE" \
            php artisan migrate --database=tenant_migrator --path=database/migrations/tenant --force

      - name: Run Laravel API and authorization tests against disposable PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host \
            --env APP_ENV --env APP_KEY --env DB_CONNECTION \
            --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT --env CENTRAL_DB_DATABASE \
            --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD \
            --env TENANT_DB_HOST --env TENANT_DB_PORT --env TENANT_DB_DATABASE \
            --env TENANT_DB_USERNAME --env TENANT_DB_PASSWORD \
            --env TENANT_MIGRATOR_DB_HOST --env TENANT_MIGRATOR_DB_PORT \
            --env TENANT_MIGRATOR_DB_DATABASE --env TENANT_MIGRATOR_DB_USERNAME \
            --env TENANT_MIGRATOR_DB_PASSWORD "$CI_IMAGE" php artisan test

      - name: Grant least-privilege tenant runtime DML
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_tenant_ci -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO tenant_runtime_ci" \
            -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO tenant_runtime_ci"

      - name: Prove tenant runtime cannot cross database boundaries or perform DDL
        shell: bash
        run: |
          set -euo pipefail

          runtime_privileges="$(docker run --rm --network host \
            --env PGPASSWORD="$TENANT_DB_PASSWORD" postgres:17 \
            psql -h 127.0.0.1 -U "$TENANT_DB_USERNAME" -d "$TENANT_DB_DATABASE" \
              -v ON_ERROR_STOP=1 -tA -c "SELECT has_table_privilege(current_user, 'public.products', 'SELECT') AND has_table_privilege(current_user, 'public.products', 'INSERT') AND has_table_privilege(current_user, 'public.products', 'UPDATE') AND has_table_privilege(current_user, 'public.products', 'DELETE')")"
          test "$runtime_privileges" = "t"
          docker run --rm --network host \
            --env PGPASSWORD="$TENANT_DB_PASSWORD" postgres:17 \
            psql -h 127.0.0.1 -U "$TENANT_DB_USERNAME" -d "$TENANT_DB_DATABASE" \
              -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) FROM public.products"

          for denied_db in berkahpos_central_ci berkahpos_tenant_b_ci; do
            if docker run --rm --network host --env PGPASSWORD="$TENANT_DB_PASSWORD" postgres:17 \
              psql -h 127.0.0.1 -U "$TENANT_DB_USERNAME" -d "$denied_db" \
                -v ON_ERROR_STOP=1 -c "SELECT 1" >/dev/null 2>&1; then
              echo "ERROR: tenant_runtime_ci unexpectedly connected to $denied_db" >&2
              exit 1
            else
              echo "PASS: tenant_runtime_ci cannot CONNECT to $denied_db"
            fi
          done

          if docker run --rm --network host --env PGPASSWORD="$TENANT_DB_PASSWORD" postgres:17 \
            psql -h 127.0.0.1 -U "$TENANT_DB_USERNAME" -d "$TENANT_DB_DATABASE" \
              -v ON_ERROR_STOP=1 -c "CREATE TABLE public.__runtime_ddl_probe(id integer)" >/dev/null 2>&1; then
            echo "ERROR: tenant_runtime_ci unexpectedly created a table" >&2
            exit 1
          else
            echo "PASS: tenant_runtime_ci cannot CREATE TABLE"
          fi

          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "DO \$\$ BEGIN IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname IN ('tenant_runtime_ci','tenant_runtime_b_ci') AND (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls)) THEN RAISE EXCEPTION 'tenant runtime role has cluster privileges'; END IF; END \$\$"

      - name: Verify central and tenant tables exist on PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_central_ci -v ON_ERROR_STOP=1 \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('tenants','domains','device_registry','tenant_configs') ORDER BY table_name"
          docker run --rm --network host --env PGPASSWORD=postgres postgres:17 \
            psql -h 127.0.0.1 -U postgres -d berkahpos_tenant_ci -v ON_ERROR_STOP=1 \
            -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('products','sales','sale_items','journal_entries','sync_receipts') ORDER BY table_name"

      - name: Build production image from the committed lock
        run: docker build --pull --target production --tag "$PROD_IMAGE" .

      - name: Smoke-test production image HTTP health and API route
        shell: bash
        run: |
          set -euo pipefail
          container="berkah-pos-prod-smoke-${{ github.run_id }}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run -d --name "$container" -p 127.0.0.1:8080:80 \
            --env APP_ENV=testing --env APP_DEBUG=false --env APP_KEY \
            --env DB_CONNECTION --env CENTRAL_DB_HOST --env CENTRAL_DB_PORT \
            --env CENTRAL_DB_DATABASE --env CENTRAL_DB_USERNAME --env CENTRAL_DB_PASSWORD "$PROD_IMAGE"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/up >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8080/up
          curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/platform-health
          docker run --rm --entrypoint composer "$PROD_IMAGE" show --locked laravel/framework
          docker run --rm --entrypoint composer "$PROD_IMAGE" show --locked filament/filament
          docker run --rm --entrypoint composer "$PROD_IMAGE" show --locked stancl/tenancy
