name: Deploy btp-admin to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "btp-admin/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, Linux, X64, btp-ci, fedora44]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare stable Pages layout
        run: |
          set -euxo pipefail
          test -f btp-admin/index.html
          rm -rf _site
          mkdir -p _site
          cp -R btp-admin _site/btp-admin
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0; url=btp-admin/">
            <link rel="canonical" href="btp-admin/">
            <title>Berkah POS Admin</title>
          </head>
          <body><a href="btp-admin/">Buka Berkah POS Admin</a></body>
          </html>
          EOF
          find _site -maxdepth 2 -type f -print | sort
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
