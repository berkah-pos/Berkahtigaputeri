name: Phase 2 Tenant Grant Security CI

on:
  pull_request:
    paths:
      - "app/**"
      - "config/**"
      - "database/**"
      - "docker/**"
      - "tests/**"
      - "scripts/check_provisioning_env_contract.py"
      - "scripts/check_central_app_grants.py"
      - "scripts/check_provisioner_grants.py"
      - "composer.json"
      - "phpunit.xml"
      - ".env.example"
      - ".github/workflows/phase2-tenant-grants-ci.yml"
  push:
    branches: ["**"]
    paths:
      - "app/**"
      - "config/**"
      - "database/**"
      - "docker/**"
      - "tests/**"
      - "scripts/check_provisioning_env_contract.py"
      - "scripts/check_central_app_grants.py"
      - "composer.json"
      - "phpunit.xml"
      - ".env.example"
      - ".github/workflows/phase2-tenant-grants-ci.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tenant-grants:
    name: Real MariaDB 11.4 tenant provisioning and grant verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify runtime/provisioner environment contract
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_provisioning_env_contract.py

      - name: Install and verify runner-provided PHP 8.3 and Composer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes php8.3-bcmath php8.3-curl php8.3-intl php8.3-mbstring php8.3-mysql php8.3-sqlite3 php8.3-xml php8.3-zip
          php --version
          composer --version
          php <<'PHP'
          <?php
          if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3) {
              fwrite(STDERR, "Expected PHP 8.3, got ".PHP_VERSION.PHP_EOL);
              exit(1);
          }
          $required = ["bcmath", "ctype", "curl", "dom", "fileinfo", "intl", "mbstring", "openssl", "pdo_mysql", "pdo_sqlite", "tokenizer", "xml", "zip"];
          $missing = array_values(array_filter($required, static fn (string $extension): bool => ! extension_loaded($extension)));
          if ($missing !== []) {
              fwrite(STDERR, "Missing required PHP extensions: ".implode(", ", $missing).PHP_EOL);
              exit(1);
          }
          echo "PASS: PHP 8.3 and required extensions are available.".PHP_EOL;
          PHP

      - name: Prepare Laravel environment
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env

      - name: Start disposable MariaDB 11.4
        env:
          MARIADB_ROOT_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name phase2-mariadb \
            --publish 127.0.0.1:3306:3306 \
            --env MARIADB_ROOT_PASSWORD="$MARIADB_ROOT_PASSWORD" \
            --env MARIADB_ROOT_HOST="%" \
            --env MARIADB_DATABASE=berkahpos_central \
            mariadb:11.4
          ready=false
          for ((attempt=1; attempt<=60; attempt++)); do
            if docker exec -e MYSQL_PWD="$MARIADB_ROOT_PASSWORD" phase2-mariadb mariadb-admin ping --user=root --silent >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs phase2-mariadb
            exit 1
          fi
          echo "PASS: disposable MariaDB 11.4 container is ready."

      - name: Install MariaDB client and Composer dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mariadb-client
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force
          find app bootstrap config database routes public tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Create isolated DB accounts and apply grants
        env:
          PROVISIONER_INIT_HOST: 127.0.0.1
          PROVISIONER_INIT_PORT: "3306"
          MARIADB_ROOT_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
          CENTRAL_DB_PASSWORD: phase2-central-${{ github.run_id }}-${{ github.run_attempt }}
          PROVISIONER_DB_PASSWORD: phase2-provisioner-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATOR_DB_PASSWORD: phase2-migrator-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          bash docker/mysql-init/00-create-provisioner.sh
          mariadb --host=127.0.0.1 --port=3306 --user=root --password="$MARIADB_ROOT_PASSWORD" < docker/mysql-init/10-tenant-db-privileges.sql

      - name: Migrate central schema using a temporary admin connection
        env:
          APP_ENV: testing
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: root
          CENTRAL_DB_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          php artisan migrate --database=central --path=database/migrations/central --force

      - name: Run actual MariaDB tenant grant, isolation, concurrency and recovery tests
        env:
          APP_ENV: testing
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: berkahpos_app
          CENTRAL_DB_PASSWORD: phase2-central-${{ github.run_id }}-${{ github.run_attempt }}
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
          PROVISIONER_DB_HOST: 127.0.0.1
          PROVISIONER_DB_PORT: "3306"
          PROVISIONER_DB_DATABASE: information_schema
          PROVISIONER_DB_USERNAME: berkahpos_provisioner
          PROVISIONER_DB_PASSWORD: phase2-provisioner-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATOR_DB_HOST: 127.0.0.1
          MIGRATOR_DB_PORT: "3306"
          MIGRATOR_DB_DATABASE: information_schema
          MIGRATOR_DB_USERNAME: berkahpos_migrator
          MIGRATOR_DB_PASSWORD: phase2-migrator-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint --test
          php artisan test --filter=TenantProvisioningMariaDbGrantsTest

      - name: Verify central app SHOW GRANTS without logging credentials
        env:
          MARIADB_ROOT_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: python3 scripts/check_central_app_grants.py
      - name: Verify provisioner and migrator SHOW GRANTS without logging credentials
        env:
          MARIADB_ROOT_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: python3 scripts/check_provisioner_grants.py

      - name: Clean up disposable MariaDB container
        if: always()
        shell: bash
        run: |
          if docker container inspect phase2-mariadb >/dev/null 2>&1; then
            docker rm --force phase2-mariadb >/dev/null
          fi
