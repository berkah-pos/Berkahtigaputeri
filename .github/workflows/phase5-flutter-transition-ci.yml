name: Phase 5 Flutter Transition Checks

on:
  pull_request:
    paths:
      - "pos-app/**"
      - "config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/verify_flutter_config_parity.py"
      - "scripts/tests/test_flutter_config_parity.py"
      - ".github/workflows/phase5-flutter-transition-ci.yml"
  push:
    branches: ["**"]
    paths:
      - "pos-app/**"
      - "config/FINAL_Production_Excel_A_WebC_Template_100Tenants.xlsx"
      - "scripts/export_workbook_for_laravel.py"
      - "scripts/verify_flutter_config_parity.py"
      - "scripts/tests/test_flutter_config_parity.py"
      - ".github/workflows/phase5-flutter-transition-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase5-flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analysis, tests, and canonical harness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare report directory
        shell: bash
        run: mkdir -p "$RUNNER_TEMP/phase5-logs"

      - name: Install workbook validator dependencies
        shell: bash
        run: |
          set -o pipefail
          python3 -m pip install --disable-pip-version-check openpyxl 2>&1 | tee "$RUNNER_TEMP/phase5-logs/python-dependencies.txt"

      - name: Validate canonical workbook and parity harness
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/export_workbook_for_laravel.py --validate-only 2>&1 | tee "$RUNNER_TEMP/phase5-logs/workbook-validation.txt"
          python3 scripts/test_canonical_workbook_contract.py 2>&1 | tee "$RUNNER_TEMP/phase5-logs/workbook-tests.txt"
          python3 scripts/tests/test_flutter_config_parity.py 2>&1 | tee "$RUNNER_TEMP/phase5-logs/parity-harness-tests.txt"

      - name: Check forbidden Flutter raw config-table fallback
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E "from[[:space:]]*\\([[:space:]]*['\\\"]app_config['\\\"]" pos-app/lib --include='*.dart'; then
            echo "ERROR: Direct app_config table access is forbidden in Flutter."
            exit 1
          fi
          echo "PASS: no raw app_config table fallback found in pos-app/lib."

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Flutter stable from official distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter-sdk.tar.xz"
          python3 - "$archive" <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import sys
          import urllib.request
          destination = pathlib.Path(sys.argv[1])
          metadata_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          request = urllib.request.Request(metadata_url, headers={"User-Agent": "berkah-pos-phase5-ci"})
          with urllib.request.urlopen(request, timeout=30) as response:
              metadata = json.load(response)
          releases = [entry for entry in metadata["releases"] if entry.get("channel") == "stable"]
          if not releases:
              raise SystemExit("No Flutter stable release found in official metadata.")
          release = max(releases, key=lambda entry: entry.get("release_date", ""))
          archive_path = release.get("archive", "")
          expected = release.get("sha256", "").lower()
          if not archive_path.startswith("stable/linux/flutter_linux_") or not archive_path.endswith("-stable.tar.xz"):
              raise SystemExit("Unexpected official Flutter archive path.")
          if len(expected) != 64:
              raise SystemExit("Official Flutter metadata did not provide SHA-256.")
          url = "https://storage.googleapis.com/flutter_infra_release/releases/" + archive_path
          request = urllib.request.Request(url, headers={"User-Agent": "berkah-pos-phase5-ci"})
          with urllib.request.urlopen(request, timeout=120) as response, destination.open("wb") as output:
              shutil.copyfileobj(response, output)
          actual = hashlib.sha256(destination.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("Flutter archive SHA-256 mismatch.")
          print("Verified official Flutter stable " + str(release.get("version", "unknown")) + " SHA256=" + actual)
          PY
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version 2>&1 | tee "$RUNNER_TEMP/phase5-logs/flutter-version.txt"

      - name: Resolve Flutter dependencies
        shell: bash
        working-directory: pos-app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/phase5-logs/flutter-pub-get.txt"

      - name: Run flutter analyze
        if: always()
        shell: bash
        working-directory: pos-app
        run: |
          set -o pipefail
          flutter analyze --no-pub 2>&1 | tee "$RUNNER_TEMP/phase5-logs/flutter-analyze.txt"

      - name: Run flutter test
        if: always()
        shell: bash
        working-directory: pos-app
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/phase5-logs/flutter-test.txt"

      - name: Prepare Android host
        working-directory: pos-app
        shell: bash
        run: bash tool/prepare_android_host.sh

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools were not found under $sdk_root." >&2
            exit 1
          fi
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$sdkmanager_path" ]]; then
            echo "::error::sdkmanager was not found under $sdk_root/cmdline-tools." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/emulator" >> "$GITHUB_PATH"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          echo "Android SDK root: $sdk_root"
          "$sdkmanager_path" --version

      - name: Install Android build and emulator components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Build debug APK for Android install verification
        working-directory: pos-app
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo "PASS: built debug APK; this is not a production-signed release."

      - name: Boot Android emulator, install APK, and smoke-launch app
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/phase5-logs"
          # Hosted runners can expose /dev/kvm without granting the runner
          # user access. This runner is disposable; enable KVM access only
          # for this job so the x86_64 emulator can use hardware acceleration.
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::Android emulator verification requires /dev/kvm on the hosted runner."
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::Unable to grant the hosted runner read/write access to /dev/kvm."
            ls -l /dev/kvm || true
            exit 1
          fi
          ls -l /dev/kvm
          # Keep avdmanager and emulator on the same explicit home. Some
          # hosted runners expose different SDK/AVD home variables, causing
          # an AVD created moments earlier to appear unknown to the emulator.
          export ANDROID_SDK_HOME="$HOME/.android"
          export ANDROID_AVD_HOME="$ANDROID_SDK_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "no" | avdmanager create avd \
            --force \
            --name phase5-pos-ci \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"
          if [[ ! -s "$ANDROID_AVD_HOME/phase5-pos-ci.ini" ]]; then
            echo "::error::avdmanager did not create $ANDROID_AVD_HOME/phase5-pos-ci.ini"
            find "$HOME/.android" -maxdepth 4 -type f -name '*.ini' -print || true
            avdmanager list avd || true
            exit 1
          fi
          avdmanager list avd
          emulator \
            -avd phase5-pos-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/phase5-logs/android-emulator.log" 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > "$RUNNER_TEMP/phase5-logs/android-emulator.pid"
          if ! timeout 120s adb wait-for-device; then
            tail -n 200 "$RUNNER_TEMP/phase5-logs/android-emulator.log" || true
            echo "::error::Android emulator never exposed an ADB device within 120 seconds."
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 120); do
            completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$completed" == "1" ]]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [[ "$booted" != true ]]; then
            tail -n 200 "$RUNNER_TEMP/phase5-logs/android-emulator.log" || true
            echo "::error::Android emulator did not finish booting."
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r pos-app/build/app/outputs/flutter-apk/app-debug.apk
          adb shell pm path id.co.berkahtigaputeri.berkahpos
          adb shell monkey -p id.co.berkahtigaputeri.berkahpos \
            -c android.intent.category.LAUNCHER 1
          sleep 8
          if ! adb shell pidof id.co.berkahtigaputeri.berkahpos >/dev/null 2>&1; then
            adb logcat -d -t 250 > "$RUNNER_TEMP/phase5-logs/android-logcat.txt" || true
            echo "::error::Installed app did not remain running after launcher smoke test."
            exit 1
          fi
          echo "PASS: debug APK installed and launcher smoke test started the app on the CI emulator."
          adb shell am force-stop id.co.berkahtigaputeri.berkahpos

      - name: Upload debug APK and Android install evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5-android-debug-install
          path: |
            pos-app/build/app/outputs/flutter-apk/app-debug.apk
            ${{ runner.temp }}/phase5-logs/android-emulator.log
            ${{ runner.temp }}/phase5-logs/android-logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload exact check output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5-flutter-check-output
          path: ${{ runner.temp }}/phase5-logs
          if-no-files-found: warn
          retention-days: 30
