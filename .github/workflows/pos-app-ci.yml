name: Canonical POS App CI

on:
  pull_request:
    paths: &kvm2_paths
      - "pos-app/**"
      - "app/**"
      - "bootstrap/**"
      - "config/**"
      - "database/**"
      - "routes/**"
      - "docker/**"
      - "composer.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/check_kvm2_contract.py"
      - "scripts/check_provisioning_env_contract.py"
      - "scripts/check_provisioner_grants.py"
      - "scripts/check_central_app_grants.py"
      - "scripts/export_workbook_for_laravel.py"
      - ".github/workflows/pos-app-ci.yml"
      - ".github/workflows/kvm2-laravel-ci.yml"
      - ".github/workflows/phase2-tenant-grants-ci.yml"
      - ".github/workflows/canonical-workbook-validate.yml"
      - "phpunit.xml"
      - "tests/**"
  push:
    branches: ["**"]
    paths: *kvm2_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-pos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and Android compile-check
    # Use a disposable GitHub-hosted runner for repeatable validation.
    # Fork pull requests are excluded from this repository-scoped validation job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check Laravel KVM2 contract
        run: python3 scripts/check_kvm2_contract.py

      - name: Lint GitHub Actions workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          version="1.7.12"
          archive="$RUNNER_TEMP/actionlint_${version}_linux_amd64.tar.gz"
          checksums="$RUNNER_TEMP/actionlint_${version}_checksums.txt"
          curl --fail --location --silent --show-error "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz" --output "$archive"
          curl --fail --location --silent --show-error "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_checksums.txt" --output "$checksums"
          (cd "$RUNNER_TEMP" && grep "actionlint_${version}_linux_amd64.tar.gz" "$checksums" | sha256sum --check --status)
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/kvm2-laravel-ci.yml .github/workflows/pos-app-ci.yml .github/workflows/phase2-tenant-grants-ci.yml .github/workflows/canonical-workbook-validate.yml

      - name: Install workbook validator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/final-pos-venv"
          "$RUNNER_TEMP/final-pos-venv/bin/python" -m pip install --disable-pip-version-check openpyxl

      - name: Validate canonical workbook
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/final-pos-venv/bin/python" scripts/export_workbook_for_laravel.py --validate-only

      - name: Check runtime/provisioner environment contract
        shell: bash
        run: python3 scripts/check_provisioning_env_contract.py

      - name: Set up PHP 8.3 and Composer v2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.3"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, openssl, pdo_mysql, pdo_sqlite, tokenizer, xml, zip
          tools: composer:v2
          coverage: none

      - name: Prepare Laravel test environment and dependencies
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --force
          find app bootstrap config database routes public tests -type f -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Start disposable MariaDB 11.4 for tenant security tests
        env:
          MARIADB_ROOT_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name phase2-mariadb \
            --publish 127.0.0.1:3306:3306 \
            --env MARIADB_ROOT_PASSWORD="$MARIADB_ROOT_PASSWORD" \
            --env MARIADB_ROOT_HOST="%" \
            --env MARIADB_DATABASE=berkahpos_central \
            mariadb:11.4
          ready=false
          for ((attempt=1; attempt<=60; attempt++)); do
            if docker exec -e MYSQL_PWD="$MARIADB_ROOT_PASSWORD" phase2-mariadb mariadb-admin ping --user=root --silent >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs phase2-mariadb
            exit 1
          fi
          echo "PASS: disposable MariaDB 11.4 container is ready."

      - name: Install MariaDB client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes mariadb-client

      - name: Create isolated DB accounts and apply grants
        env:
          PROVISIONER_INIT_HOST: 127.0.0.1
          PROVISIONER_INIT_PORT: "3306"
          MARIADB_ROOT_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
          CENTRAL_DB_PASSWORD: phase2-central-${{ github.run_id }}-${{ github.run_attempt }}
          PROVISIONER_DB_PASSWORD: phase2-provisioner-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATOR_DB_PASSWORD: phase2-migrator-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          bash docker/mysql-init/00-create-provisioner.sh
          mariadb --host=127.0.0.1 --port=3306 --user=root --password="$MARIADB_ROOT_PASSWORD" < docker/mysql-init/10-tenant-db-privileges.sql

      - name: Migrate central schema using disposable admin credential
        env:
          APP_ENV: testing
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: root
          CENTRAL_DB_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: php artisan migrate --database=central --path=database/migrations/central --force

      - name: Run real MariaDB provisioning, grants, isolation, concurrency, and recovery tests
        env:
          APP_ENV: testing
          DB_CONNECTION: central
          CENTRAL_DB_HOST: 127.0.0.1
          CENTRAL_DB_PORT: "3306"
          CENTRAL_DB_DATABASE: berkahpos_central
          CENTRAL_DB_USERNAME: berkahpos_app
          CENTRAL_DB_PASSWORD: phase2-central-${{ github.run_id }}-${{ github.run_attempt }}
          TENANT_DB_HOST: 127.0.0.1
          TENANT_DB_PORT: "3306"
          PROVISIONER_DB_HOST: 127.0.0.1
          PROVISIONER_DB_PORT: "3306"
          PROVISIONER_DB_DATABASE: information_schema
          PROVISIONER_DB_USERNAME: berkahpos_provisioner
          PROVISIONER_DB_PASSWORD: phase2-provisioner-${{ github.run_id }}-${{ github.run_attempt }}
          MIGRATOR_DB_HOST: 127.0.0.1
          MIGRATOR_DB_PORT: "3306"
          MIGRATOR_DB_DATABASE: information_schema
          MIGRATOR_DB_USERNAME: berkahpos_migrator
          MIGRATOR_DB_PASSWORD: phase2-migrator-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/pint --test
          php artisan test --filter=TenantProvisioningMariaDbGrantsTest

      - name: Verify central app SHOW GRANTS without logging credentials
        env:
          MARIADB_ROOT_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/check_central_app_grants.py

      - name: Verify provisioner and migrator SHOW GRANTS without logging credentials
        env:
          MARIADB_ROOT_PASSWORD: phase2-root-${{ github.run_id }}-${{ github.run_attempt }}
        run: python3 scripts/check_provisioner_grants.py

      - name: Remove disposable MariaDB after tenant security tests
        if: always()
        shell: bash
        run: |
          if docker container inspect phase2-mariadb >/dev/null 2>&1; then
            docker rm --force phase2-mariadb >/dev/null
          fi

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Flutter stable from official distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/flutter-sdk.tar.xz"
          python3 - "$archive" <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import sys
          import urllib.parse
          import urllib.request

          destination = pathlib.Path(sys.argv[1])
          metadata_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_linux.json"
          request = urllib.request.Request(metadata_url, headers={"User-Agent": "berkah-pos-ci"})
          with urllib.request.urlopen(request, timeout=30) as response:
              metadata = json.load(response)
          stable = [release for release in metadata["releases"] if release.get("channel") == "stable"]
          if not stable:
              raise SystemExit("No stable Flutter release was listed by the official release metadata.")
          release = max(stable, key=lambda item: item.get("release_date", ""))
          archive_path = release.get("archive", "")
          expected_sha256 = release.get("sha256", "").lower()
          if not archive_path.startswith("stable/linux/flutter_linux_") or not archive_path.endswith("-stable.tar.xz"):
              raise SystemExit(f"Unexpected Flutter archive path: {archive_path!r}")
          if len(expected_sha256) != 64:
              raise SystemExit("Official Flutter release metadata did not include a SHA-256 checksum.")
          archive_url = urllib.parse.urljoin("https://storage.googleapis.com/flutter_infra_release/releases/", archive_path)
          request = urllib.request.Request(archive_url, headers={"User-Agent": "berkah-pos-ci"})
          with urllib.request.urlopen(request, timeout=120) as response, destination.open("wb") as output:
              shutil.copyfileobj(response, output)
          actual_sha256 = hashlib.sha256(destination.read_bytes()).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"Flutter archive checksum mismatch: expected {expected_sha256}, got {actual_sha256}")
          print(f"Verified official Flutter stable {release.get('version', 'unknown')} ({actual_sha256})")
          PY
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version


      - name: Resolve packages
        working-directory: pos-app
        run: flutter pub get

      - name: Analyze Dart
        working-directory: pos-app
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: pos-app
        run: flutter test --no-pub

      # Generate any missing Android host files without modifying the canonical
      # app Gradle file. This checkout is disposable and uses the same script
      # developers can run locally before a debug build.
      - name: Prepare Android host
        working-directory: pos-app
        run: bash tool/prepare_android_host.sh

      - name: Locate Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_HOME:-}" ]]; then
            sdk_root="$ANDROID_HOME"
          elif [[ -n "${ANDROID_SDK_ROOT:-}" ]]; then
            sdk_root="$ANDROID_SDK_ROOT"
          else
            sdk_root="/usr/local/lib/android/sdk"
          fi
          if [[ ! -d "$sdk_root/cmdline-tools" ]]; then
            echo "::error::Android command-line tools were not found under $sdk_root." >&2
            exit 1
          fi
          sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$sdkmanager_path" ]]; then
            echo "::error::sdkmanager was not found in the hosted runner Android SDK." >&2
            exit 1
          fi
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          dirname "$sdkmanager_path" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          "$sdkmanager_path" --version

      - name: Accept SDK licenses and install compile platforms
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager is the final command in this pipe; avoid treating `yes`'s
          # expected SIGPIPE after sdkmanager exits as a license-acceptance failure.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"


      - name: Build debug Android App Bundle
        working-directory: pos-app
        run: flutter build appbundle --debug --no-pub

      - name: Upload debug-only compile-check artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: berkahtigaputeri-pos-debug-aab
          path: pos-app/build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 7

