name: Canonical POS App CI

on:
  pull_request:
    paths:
      - "pos-app/**"
      - ".github/workflows/pos-app-ci.yml"
  push:
    branches: ["**"]
    paths:
      - "pos-app/**"
      - ".github/workflows/pos-app-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-pos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze, test, and Android compile-check
    # Use a disposable GitHub-hosted runner for repeatable validation.
    # Never run untrusted fork code on a privileged self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        working-directory: pos-app
        run: flutter pub get

      - name: Analyze Dart
        working-directory: pos-app
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: pos-app
        run: flutter test --no-pub

      # Generate any missing Android host files without modifying the canonical
      # app Gradle file. This checkout is disposable and uses the same script
      # developers can run locally before a debug build.
      - name: Prepare Android host
        working-directory: pos-app
        run: bash tool/prepare_android_host.sh

      - name: Verify new application identity and client-secret boundary
        working-directory: pos-app
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.berkahtigaputeri.pos"' android/app/build.gradle
          grep -q 'namespace = "com.berkahtigaputeri.pos"' android/app/build.gradle
          grep -q 'versionCode = 1' android/app/build.gradle
          grep -q 'versionName = "1.0.0"' android/app/build.gradle
          grep -q 'targetSdk = 35' android/app/build.gradle
          if grep -R -n -E 'SUPABASE_SERVICE_ROLE_KEY|service_role|DATABASE_URL=.*PASSWORD' lib; then
            echo "Privileged server/database credentials must not be embedded in the Flutter app." >&2
            exit 1
          fi

      - name: Install Android SDK platforms
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses and install compile platforms
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Build debug Android App Bundle
        working-directory: pos-app
        run: flutter build appbundle --debug --no-pub

      - name: Upload debug-only compile-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: berkahtigaputeri-pos-debug-aab
          path: pos-app/build/app/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
          retention-days: 7
