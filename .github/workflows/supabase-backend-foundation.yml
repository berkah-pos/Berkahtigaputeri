name: Supabase Backend Foundation CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/check_supabase_backend_foundation.py"
      - "docs/permanent/DOC_16_SUPABASE_MIGRATION_RECONCILIATION.md"
      - "supabase/reconciliation/**"
      - "scripts/check_supabase_migration_reconciliation.py"
      - "scripts/check_supabase_source_recovery.py"
      - "scripts/compare_reconstructed_catalog_fingerprint.py"
      - "docs/permanent/DOC_17_SUPABASE_SOURCE_RECOVERY_AND_CLEAN_REPLAY.md"
      - "AGENTS.md"
      - "docs/permanent/DOC_00_CANONICAL_ARCHITECTURE_DECISION.md"
      - "docs/permanent/DOC_00_MASTER_ROADMAP.md"
      - "docs/permanent/DOC_12_SAAS_DATABASE_OFFLINE_ARCHITECTURE_AND_AGENT_PROTOCOL.md"
      - "docs/permanent/DOC_14_SUPABASE_IDCLOUDHOST_BACKEND_FOUNDATION.md"
      - "docs/permanent/DOC_15_PRODUCTION_BACKEND_DEPLOYMENT_RUNBOOK.md"
      - ".github/workflows/supabase-backend-foundation.yml"
  push:
    branches: ["**"]
    paths:
      - "supabase/**"
      - "scripts/check_supabase_backend_foundation.py"
      - "docs/permanent/DOC_16_SUPABASE_MIGRATION_RECONCILIATION.md"
      - "supabase/reconciliation/**"
      - "scripts/check_supabase_migration_reconciliation.py"
      - "AGENTS.md"
      - "docs/permanent/DOC_00_CANONICAL_ARCHITECTURE_DECISION.md"
      - "docs/permanent/DOC_00_MASTER_ROADMAP.md"
      - "docs/permanent/DOC_12_SAAS_DATABASE_OFFLINE_ARCHITECTURE_AND_AGENT_PROTOCOL.md"
      - "docs/permanent/DOC_14_SUPABASE_IDCLOUDHOST_BACKEND_FOUNDATION.md"
      - "docs/permanent/DOC_15_PRODUCTION_BACKEND_DEPLOYMENT_RUNBOOK.md"
      - ".github/workflows/supabase-backend-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backend-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Supabase configuration and architecture guardrails
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate local Supabase foundation
        run: python3 scripts/check_supabase_backend_foundation.py

      - name: Validate recorded Supabase migration reconciliation
        run: python3 scripts/check_supabase_migration_reconciliation.py

      - name: Validate recovered migration source and reconstructed baseline
        run: python3 scripts/check_supabase_source_recovery.py

      - name: Check patch whitespace
        run: git diff --check

  clean-replay:
    name: Reconstructed baseline clean replay (disposable Supabase only)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate recovery manifest and reconstructed object inventory
        run: python3 scripts/check_supabase_source_recovery.py

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: 2.120.0

      - name: Assemble temporary single-migration project
        shell: bash
        run: |
          set -euo pipefail
          REPLAY_DIR="$RUNNER_TEMP/berkah-pos-staging-reconstruction-replay"
          mkdir -p "$REPLAY_DIR/supabase/migrations" "$REPLAY_DIR/supabase/tests"
          cp supabase/reconciliation/reconstructed/staging-baseline/config.toml "$REPLAY_DIR/supabase/config.toml"
          migration="$REPLAY_DIR/supabase/migrations/20261014100000_reconstructed_staging_baseline.sql"
          : > "$migration"
          cat supabase/reconciliation/reconstructed/staging-baseline/010_tables_and_sequences.sql >> "$migration"
          printf '\n' >> "$migration"
          cat supabase/reconciliation/reconstructed/staging-baseline/020_constraints_and_indexes.sql >> "$migration"
          printf '\n' >> "$migration"
          for part in supabase/reconciliation/reconstructed/staging-baseline/030_plpgsql_*.sql; do
            cat "$part" >> "$migration"
            printf '\n' >> "$migration"
          done
          cat supabase/reconciliation/reconstructed/staging-baseline/031_sql_functions.sql >> "$migration"
          printf '\n' >> "$migration"
          cat supabase/reconciliation/reconstructed/staging-baseline/040_rls_policies_and_triggers.sql >> "$migration"
          printf '\n' >> "$migration"
          cat supabase/reconciliation/reconstructed/staging-baseline/050_object_acl.sql >> "$migration"
          printf '\n' >> "$migration"
          cat supabase/reconciliation/reconstructed/staging-baseline/060_target_default_privilege_hardening.sql >> "$migration"
          cp supabase/reconciliation/reconstructed/staging-baseline/replay_validation.test.sql "$REPLAY_DIR/supabase/tests/replay_validation.test.sql"
          test -s "$migration"
          printf 'assembled_sql_bytes=%s\n' "$(wc -c < "$migration")"

      - name: Start isolated disposable Supabase stack
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/berkah-pos-staging-reconstruction-replay"
          supabase start --exclude studio,postgres-meta,edge-runtime,logflare,vector,imgproxy,realtime,storage-api,supavisor

      - name: Clean-reset and replay reconstructed schema
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/berkah-pos-staging-reconstruction-replay"
          supabase db reset --local

      - name: Run replay and target-security assertions
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/berkah-pos-staging-reconstruction-replay"
          supabase test db --local

      - name: Compare isolated schema to the staging structural fingerprint
        shell: bash
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -X -A -t -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/reconciliation/catalog_fingerprint.sql" \
            > "$RUNNER_TEMP/local-reconstructed-fingerprint.json"
          python3 scripts/compare_reconstructed_catalog_fingerprint.py "$RUNNER_TEMP/local-reconstructed-fingerprint.json"

      - name: Stop isolated stack
        if: always()
        shell: bash
        run: |
          REPLAY_DIR="$RUNNER_TEMP/berkah-pos-staging-reconstruction-replay"
          if [[ -d "$REPLAY_DIR" ]]; then
            cd "$REPLAY_DIR"
            supabase stop --no-backup || true
          fi
