name: Supabase Functions Security & Tests

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions.yml'

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, Fedora]
    timeout-minutes: 20
    env:
      # Non-secret dummy values satisfy module-level required configuration for unit tests.
      SUPABASE_URL: 'http://127.0.0.1:54321'
      SUPABASE_SERVICE_ROLE_KEY: 'ci-placeholder-not-a-real-key'
      MIDTRANS_SERVER_KEY: 'ci-placeholder-server-key'
      MIDTRANS_IS_PRODUCTION: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scan repository for secrets
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/xdg-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"
          podman run --rm -v "$PWD:/repo:Z" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source . --log-opts="--all" --redact -v
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint Edge Function source
        run: deno lint supabase/functions
      - name: Type-check Edge Functions
        run: |
          deno check             supabase/functions/subscription-api/index.ts             supabase/functions/licence-check/index.ts             supabase/functions/coretax-adapter/index.ts
      - name: Test subscription security and state transitions
        run: deno test --allow-env supabase/functions/subscription-api
