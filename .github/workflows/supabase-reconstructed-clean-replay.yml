name: Supabase Reconstructed Baseline Clean Replay

on:
  pull_request:
    paths:
      - "supabase/reconciliation/reconstructed/staging-baseline/**"
      - "supabase/reconciliation/source-recovery-manifest-2026-10-14.json"
      - "supabase/reconciliation/catalog_fingerprint.sql"
      - "scripts/check_supabase_source_recovery.py"
      - "scripts/compare_reconstructed_catalog_fingerprint.py"
      - ".github/workflows/supabase-reconstructed-clean-replay.yml"
  push:
    branches: ["**"]
    paths:
      - "supabase/reconciliation/reconstructed/staging-baseline/**"
      - "supabase/reconciliation/source-recovery-manifest-2026-10-14.json"
      - "supabase/reconciliation/catalog_fingerprint.sql"
      - "scripts/check_supabase_source_recovery.py"
      - "scripts/compare_reconstructed_catalog_fingerprint.py"
      - ".github/workflows/supabase-reconstructed-clean-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-reconstructed-clean-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-replay:
    name: Validate reconstruction and install CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate recovery manifest and reconstructed object inventory
        run: python3 scripts/check_supabase_source_recovery.py

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: 2.120.0

      - name: Report installed version
        run: supabase --version
