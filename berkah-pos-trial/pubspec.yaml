name: berkah_pos
description: Berkah POS - PT Berkah Tiga Puteri, local trial POS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  path: ^1.9.0
  # Keep the non-federated implementation compatible with the required API 35 compile SDK.
  sqflite: 2.3.3+2
  url_launcher: 6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# url_launcher_android 6.3.26+ raises AndroidX core to 1.17.0 and 6.3.27+
# raises AndroidX Browser to 1.9.0; both require compileSdk 36. Keep this
# implementation at 6.3.9 for the app's required compileSdk 35.
dependency_overrides:
  url_launcher_android: 6.3.9

flutter:
  uses-material-design: true
