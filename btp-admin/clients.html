<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self' https://*.supabase.co; upgrade-insecure-requests; block-all-mixed-content"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berkah POS - Clients</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="auth.js"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f7f7f7;color:#111}main{max-width:1180px;margin:auto;padding:22px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.card{background:#fff;border:1px solid #bbb;padding:14px;margin:12px 0}input,select,button,.btn{padding:9px;font:inherit}button,.btn{border:1px solid #111;background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:#111;display:inline-block}.primary{background:#111!important;color:#fff!important}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ccc;padding:8px;text-align:left;font-size:13px}th{background:#eee}.danger{background:#ffe5e5}.mono{font-family:monospace}.status{white-space:pre-wrap;padding:10px;border:1px solid #aaa;background:#fff}@media(max-width:800px){.scroll{overflow:auto}}</style></head><body><main><div class="bar"><div><h1>Super Admin - Clients</h1><div class="mono">tenants + devices.last_seen_at</div></div><div style="margin-left:auto"><a class="btn primary" href="final-pos-template-admin.html">Final Pos - Template Admin (100 Tenants)</a> <button onclick="location.href='login.html'">Login</button> <button onclick="BTP_AUTH.logout()">Logout</button></div></div><div class="card bar"><label>Search<br><input id="q" placeholder="tenant / toko"></label><label>Paket<br><select id="paket"><option value="">Semua</option><option>basic</option><option>pro</option><option>enterprise</option></select></label><label>Blocked<br><select id="blocked"><option value="">Semua</option><option value="false">Aktif</option><option value="true">Blocked</option></select></label><button class="primary" id="add">Add Tenant</button><button id="reload">Reload</button></div><div id="status" class="status">Loading...</div><div class="scroll"><table><thead><tr><th>tenant_id</th><th>toko_name</th><th>paket</th><th>features.pos</th><th>features.akuntansi</th><th>max_user</th><th>expiry</th><th>last_seen</th><th>blocked</th><th>action</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
let all=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function expiryDanger(v){if(!v)return false;const d=(new Date(v+'T23:59:59')-new Date())/86400000;return d<7;}
function render(){const text=$('q').value.toLowerCase(),p=$('paket').value,b=$('blocked').value;const list=all.filter(x=>(!text||`${x.tenant_id} ${x.toko_name}`.toLowerCase().includes(text))&&(!p||x.paket===p)&&(!b||String(x.is_blocked)===b));$('rows').innerHTML=list.map(x=>`<tr class="${expiryDanger(x.expiry)?'danger':''}"><td class="mono">${esc(x.tenant_id)}</td><td>${esc(x.toko_name)}</td><td>${esc(x.paket)}</td><td>${x.features?.pos?'✅':'—'}</td><td>${x.features?.akuntansi?'✅':'—'}</td><td>${esc(x.max_user)}</td><td>${esc(x.expiry||'')}</td><td>${esc(x.last_seen||'—')}</td><td>${x.is_blocked?'BLOCKED':'aktif'}</td><td><a href="edit.html?tenant=${encodeURIComponent(x.tenant_id)}">Edit</a></td></tr>`).join('');$('status').textContent=`${list.length}/${all.length} tenant. Expiry < 7 hari ditandai merah.`;}
async function load(){const u=await BTP_AUTH.requireAdmin();if(!u)return;try{const c=BTP_AUTH.client();const [{data:t,error:e1},{data:d,error:e2}]=await Promise.all([c.from('tenants').select('tenant_id,toko_name,paket,features,max_user,expiry,is_blocked').order('tenant_id'),c.from('devices').select('tenant_id,last_seen_at')]);if(e1)throw e1;if(e2)throw e2;const last={};(d||[]).forEach(r=>{if(r.last_seen_at&&(!last[r.tenant_id]||r.last_seen_at>last[r.tenant_id]))last[r.tenant_id]=r.last_seen_at});all=(t||[]).map(x=>({...x,last_seen:last[x.tenant_id]||null}));render();}catch(e){$('status').textContent='Load gagal: '+e.message;}}
async function addTenant(){const u=await BTP_AUTH.requireAdmin();if(!u)return;const tenant_id=prompt('tenant_id (contoh clientA)');if(!tenant_id)return;const toko_name=prompt('Nama toko',tenant_id)||tenant_id;const paket=prompt('Paket: basic/pro/enterprise','basic')||'basic';try{const {error}=await BTP_AUTH.client().from('tenants').insert({tenant_id,toko_name,paket,features:{pos:true,akuntansi:false},max_user:1,is_blocked:false});if(error)throw error;await load();}catch(e){alert('Add Tenant gagal: '+e.message);}}
['q','paket','blocked'].forEach(id=>$(id).addEventListener('input',render));$('reload').onclick=load;$('add').onclick=addTenant;load();
</script></body></html>
