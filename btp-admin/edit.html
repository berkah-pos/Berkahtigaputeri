<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berkah POS - Edit Tenant</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="admin-fields.js"></script><script src="editor-core.js"></script><script src="feature-flags.js"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f7f7f7;color:#111}main{max-width:1100px;margin:auto;padding:22px}.top,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top button:last-child{margin-left:auto}.card{background:#fff;border:1px solid #bbb;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field small{color:#666}input:not([type=checkbox]),select,textarea{width:100%;padding:9px;border:1px solid #888}textarea{min-height:62px}.check{display:flex;gap:8px;align-items:center;padding:9px;border:1px solid #888}button,.button{padding:9px 12px;border:1px solid #111;background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:#111}.primary{background:#111;color:#fff}.status{white-space:pre-wrap;border:1px solid #aaa;background:#fff;padding:12px}.ok{border-color:#188038}.effective{font-weight:700;border-left:4px solid #111;padding:10px;background:#fff}.flags{display:flex;gap:16px;flex-wrap:wrap}.flags label{font-weight:700;border:1px solid #aaa;padding:10px}.muted{color:#666}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="top"><button onclick="location.href='clients.html'">← Clients</button><h1>Edit Tenant: <span id="tenantLabel"></span></h1><a id="historyLink" class="button" href="history.html">History</a><button onclick="BTP_AUTH.logout()">Logout</button></div><p>Device aktif: <code id="deviceLabel"></code></p><div id="effective" class="effective">Loading inheritance...</div><div class="card"><h2>Feature Flags - 2 Layanan</h2><div class="flags"><label><input id="featurePos" type="checkbox"> POS</label><label><input id="featureAkuntansi" type="checkbox"> AKUNTANSI</label></div><p id="featureNote" class="muted">Loading features...</p></div><div class="card toolbar"><button onclick="reloadAll()">Reload</button><button class="primary" onclick="BTP_EDITOR.saveGlobal()">SAVE GLOBAL</button><button class="primary" onclick="saveTenantAndFeatures()">SAVE TENANT</button><button class="primary" onclick="BTP_EDITOR.saveDevice()">SAVE DEVICE</button><button class="primary" onclick="BTP_EDITOR.savePos()">SAVE POS SERVICE</button><button class="primary" onclick="BTP_EDITOR.saveAkuntansi()">SAVE AKUNTANSI SERVICE</button></div><div id="status" class="status">Loading...</div><div id="sections"></div></main><script>
async function boot(){const ok=await BTP_EDITOR.init();if(ok){try{await BTP_FEATURES.init();}catch(e){document.getElementById('status').textContent+='\nFeature flags gagal: '+e.message;}}}
async function reloadAll(){try{const ok=await BTP_EDITOR.load();if(ok)await BTP_FEATURES.init();}catch(e){document.getElementById('status').textContent='Reload gagal: '+e.message;}}
async function saveTenantAndFeatures(){try{const patch=BTP_FEATURES.patch();const ok=await BTP_EDITOR.saveTenant(patch);if(!ok)return;BTP_FEATURES.markSaved();document.getElementById('status').textContent+='\\nTenant + canonical features tersimpan melalui atomic config.';}catch(e){document.getElementById('status').textContent='SAVE TENANT/features gagal: '+e.message;}}
boot();
</script></body></html>
