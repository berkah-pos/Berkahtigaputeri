<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self' https://*.supabase.co; upgrade-insecure-requests; block-all-mixed-content">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Berkah POS — Final Pos Template Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
  <script src="auth.js"></script>
  <style>
    html,body{height:100%;margin:0;background:#111827;font-family:Arial,sans-serif}
    #templateApp{display:block;width:100%;height:100%;border:0;background:#f8fafc}
    #phase6Status{position:fixed;right:16px;top:16px;z-index:9999;max-width:min(520px,calc(100vw - 32px));padding:10px 14px;border-radius:8px;background:#111827;color:#fff;box-shadow:0 8px 30px #0004;font-size:13px;line-height:1.4;display:none}
    #phase6Status.ok{background:#166534}#phase6Status.error{background:#991b1b}
  </style>
</head>
<body>
  <div id="phase6Status" role="status" aria-live="polite"></div>
  <iframe id="templateApp" title="Final Pos Template Admin"></iframe>
  <script>
  (function(){
    const frame=document.getElementById('templateApp');
    const statusEl=document.getElementById('phase6Status');
    const cache=new Map();
    let lastHydrated='';

    function status(message,kind='ok'){
      statusEl.textContent=message;
      statusEl.className=kind;
      statusEl.style.display='block';
      clearTimeout(status._timer);
      status._timer=setTimeout(()=>{statusEl.style.display='none';},6500);
    }

    function activeTemplate(doc){
      for(const node of doc.querySelectorAll('h1,h2,h3,div,span')){
        const text=(node.textContent||'').trim();
        const match=text.match(/^TEMPLATE CONFIG\s*•\s*(BASIC|PRO|ENTERPRISE)$/i);
        if(match)return match[1].toUpperCase();
      }
      return '';
    }

    function labelControl(doc,prefix){
      const wanted=prefix.toLowerCase();
      for(const label of doc.querySelectorAll('label')){
        const text=(label.textContent||'').trim().toLowerCase();
        if(text.startsWith(wanted)){
          const control=label.querySelector('input,select,textarea');
          if(control)return control;
        }
      }
      return null;
    }

    function readText(doc,prefix){
      const control=labelControl(doc,prefix);
      return control?String(control.value??'').trim():null;
    }
    function readNumber(doc,prefix){
      const raw=readText(doc,prefix);
      if(raw===null||raw==='')return null;
      const n=Number(raw);
      return Number.isFinite(n)?n:null;
    }
    function readChecked(doc,prefix){
      const control=labelControl(doc,prefix);
      return control&&control.type==='checkbox'?Boolean(control.checked):null;
    }

    function setControl(control,value){
      if(!control||value===undefined||value===null)return;
      const win=frame.contentWindow;
      if(control.type==='checkbox'){
        const setter=Object.getOwnPropertyDescriptor(win.HTMLInputElement.prototype,'checked')?.set;
        if(setter)setter.call(control,Boolean(value));else control.checked=Boolean(value);
        control.dispatchEvent(new win.Event('change',{bubbles:true}));
        return;
      }
      const proto=control.tagName==='SELECT'?win.HTMLSelectElement.prototype:
        control.tagName==='TEXTAREA'?win.HTMLTextAreaElement.prototype:win.HTMLInputElement.prototype;
      const setter=Object.getOwnPropertyDescriptor(proto,'value')?.set;
      if(setter)setter.call(control,String(value));else control.value=String(value);
      control.dispatchEvent(new win.Event(control.tagName==='SELECT'?'change':'input',{bubbles:true}));
    }

    function dbValue(value,key){
      if(Object.prototype.hasOwnProperty.call(value,key))return value[key];
      const fields=value.fields;
      return fields&&typeof fields==='object'?fields[key]:undefined;
    }

    function hydrate(doc,value){
      const mappings=[
        ['Max User',value.max_user??value['Max User']],
        ['Template Price',value.price_per_month??value.price],
        ['PPN Rate %',dbValue(value,'PPN Rate %')],
        ['PPN Account',dbValue(value,'PPN Account')],
        ['DPP Account',dbValue(value,'DPP Account')],
        ['Sales Tunai',dbValue(value,'Sales Tunai')],
        ['Sales QRIS Pending',dbValue(value,'Sales QRIS Pending')],
        ['Sales Transfer',dbValue(value,'Sales Transfer')],
        ['Selisih Kas Plus',dbValue(value,'Selisih Plus')],
        ['Selisih Kas Minus',dbValue(value,'Selisih Minus')],
        ['PPN Exempt',dbValue(value,'PPN Exempt')],
        ['Anti Double Posting',dbValue(value,'Anti Double')],
        ['QRIS MDR %',value.MDR??value.mdr??dbValue(value,'MDR')],
        ['Tunai Enabled',dbValue(value,'Tunai')],
        ['QRIS Enabled',dbValue(value,'QRIS')],
        ['Transfer Enabled',dbValue(value,'Transfer')]
      ];
      for(const [label,val] of mappings)setControl(labelControl(doc,label),val);
      const settlement=dbValue(value,'Settlement H+1');
      if(typeof settlement==='boolean')setControl(labelControl(doc,'Settlement'),settlement?'H+1':'H+0 API');
    }

    async function loadRow(templateId){
      if(cache.has(templateId))return cache.get(templateId);
      const key=`template:${templateId}`;
      const {data,error}=await BTP_AUTH.client().from('app_config')
        .select('key,value,updated_at').eq('key',key).single();
      if(error)throw error;
      const version=Number(data?.value?.version);
      if(!Number.isInteger(version)||version<1)throw new Error(`${key} tidak memiliki version positif`);
      cache.set(templateId,data);
      return data;
    }

    async function ensureHydrated(){
      const doc=frame.contentDocument;
      if(!doc)return;
      const templateId=activeTemplate(doc);
      if(!templateId||templateId===lastHydrated)return;
      try{
        const row=await loadRow(templateId);
        if(activeTemplate(doc)!==templateId)return;
        hydrate(doc,row.value||{});
        lastHydrated=templateId;
      }catch(error){status(`Load ${templateId} gagal: ${error.message}`,'error');}
    }

    function buildNewValue(doc,current){
      const next={...current};
      const fields={...(current.fields&&typeof current.fields==='object'?current.fields:{})};
      function field(label,key){
        const value=readText(doc,label);
        if(value!==null){next[key]=value;fields[key]=value;}
      }
      function numberField(label,key){
        const value=readNumber(doc,label);
        if(value!==null){next[key]=value;fields[key]=value;}
      }
      function boolField(label,key){
        const value=readChecked(doc,label);
        if(value!==null){next[key]=value;fields[key]=value;}
      }

      const maxUser=readNumber(doc,'Max User');
      if(maxUser!==null){next.max_user=maxUser;if(Object.prototype.hasOwnProperty.call(next,'Max User'))next['Max User']=maxUser;}
      const price=readNumber(doc,'Template Price');
      if(price!==null){next.price_per_month=price;next.price=price;}
      numberField('PPN Rate %','PPN Rate %');
      field('PPN Account','PPN Account');
      field('DPP Account','DPP Account');
      field('Sales Tunai','Sales Tunai');
      field('Sales QRIS Pending','Sales QRIS Pending');
      field('Sales Transfer','Sales Transfer');
      field('Selisih Kas Plus','Selisih Plus');
      field('Selisih Kas Minus','Selisih Minus');
      field('PPN Exempt','PPN Exempt');
      numberField('Anti Double Posting','Anti Double');

      const mdr=readNumber(doc,'QRIS MDR %');
      if(mdr!==null){next.MDR=mdr;next.mdr=mdr;next.mdr_pos=mdr;fields.MDR=mdr;}
      boolField('Tunai Enabled','Tunai');
      boolField('QRIS Enabled','QRIS');
      boolField('Transfer Enabled','Transfer');
      const settlement=readText(doc,'Settlement');
      if(settlement!==null){const h1=settlement==='H+1';next['Settlement H+1']=h1;fields['Settlement H+1']=h1;}

      next.fields=fields;
      delete next.version;
      return next;
    }

    async function saveActive(doc){
      const templateId=activeTemplate(doc);
      if(!templateId)throw new Error('Template aktif tidak ditemukan');
      const row=await loadRow(templateId);
      const expectedVersion=Number(row.value.version);
      const newValue=buildNewValue(doc,row.value||{});
      const {data,error}=await BTP_AUTH.client().rpc('update_app_config_atomic',{
        p_key:row.key,
        p_new_value:newValue,
        p_expected_version:expectedVersion
      });
      if(error){
        if(error.code==='40001'){
          cache.delete(templateId);
          lastHydrated='';
          await ensureHydrated();
          status('Data changed by another admin, please reload','error');
          return false;
        }
        throw error;
      }
      const stored=Array.isArray(data)?data[0]:data;
      const version=Number(stored?.version);
      if(!stored||typeof stored!=='object'||Array.isArray(stored)||!Number.isInteger(version)||version!==expectedVersion+1)throw new Error('Respons atomic RPC tidak valid');
      cache.set(templateId,{key:row.key,value:stored,updated_at:new Date().toISOString()});
      lastHydrated=templateId;
      status(`SAVE TEMPLATE ${templateId} OK · version ${expectedVersion} → ${version}`,'ok');
      return true;
    }

    async function boot(){
      const user=await BTP_AUTH.requireAdmin();
      if(!user)return;
      frame.src='final-pos-template-admin-legacy.html';
      frame.addEventListener('load',()=>{
        const doc=frame.contentDocument;
        if(!doc)return;
        doc.addEventListener('click',async event=>{
          const button=event.target.closest?.('button');
          if(!button)return;
          const text=(button.textContent||'').trim().toUpperCase();
          if(text.startsWith('SAVE TEMPLATE')){
            event.preventDefault();
            event.stopImmediatePropagation();
            try{await saveActive(doc);}catch(error){status(`Save gagal: ${error.message}`,'error');}
          }
        },true);
        const observer=new frame.contentWindow.MutationObserver(()=>{void ensureHydrated();});
        observer.observe(doc.body,{childList:true,subtree:true,characterData:true});
        void ensureHydrated();
      },{once:true});
    }

    void boot();
  })();
  </script>
</body>
</html>
