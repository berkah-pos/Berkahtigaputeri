<!doctype html><html lang="id"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self' https://*.supabase.co; upgrade-insecure-requests; block-all-mixed-content"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Berkah POS - Config History</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script><script src="auth.js"></script><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f7f7f7;color:#111}main{max-width:1200px;margin:auto;padding:22px}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top button:last-child{margin-left:auto}input,button{padding:9px;font:inherit}input{min-width:360px}button{border:1px solid #111;background:#fff;font-weight:700}.status{white-space:pre-wrap;border:1px solid #aaa;background:#fff;padding:10px;margin:12px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ccc;padding:8px;vertical-align:top;font-size:12px}th{background:#eee}pre{margin:0;white-space:pre-wrap;max-width:420px}.mono{font-family:monospace}@media(max-width:700px){input{min-width:0;width:100%}}</style></head><body><main><div class="top"><button onclick="history.back()">← Kembali</button><h1>Config History</h1><button onclick="BTP_AUTH.logout()">Logout</button></div><div class="top"><label>Key <input id="keyInput" class="mono"></label><button id="loadBtn">Load History</button></div><div id="status" class="status">Loading...</div><div class="scroll"><table><thead><tr><th>version</th><th>changed_at</th><th>changed_by</th><th>old_value</th><th>new_value</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const u=await BTP_AUTH.requireAdmin();if(!u)return;const key=$('keyInput').value.trim();if(!key){$('status').textContent='Key wajib diisi.';return;}try{const {data,error}=await BTP_AUTH.client().from('config_history').select('version,changed_at,changed_by,old_value,new_value').eq('key',key).order('changed_at',{ascending:false}).limit(200);if(error)throw error;$('rows').innerHTML=(data||[]).map(r=>`<tr><td>${esc(r.version)}</td><td>${esc(r.changed_at)}</td><td>${esc(r.changed_by||'')}</td><td><pre>${esc(JSON.stringify(r.old_value,null,2))}</pre></td><td><pre>${esc(JSON.stringify(r.new_value,null,2))}</pre></td></tr>`).join('');$('status').textContent=`${data?.length||0} perubahan untuk ${key}`;}catch(e){$('status').textContent='Load history gagal: '+e.message;}}
$('keyInput').value=new URLSearchParams(location.search).get('key')||'tenant:berkah_sumber';$('loadBtn').onclick=load;load();
</script></body></html>
