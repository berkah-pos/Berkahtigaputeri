<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; form-action 'self' https://*.supabase.co; upgrade-insecure-requests; block-all-mixed-content">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Berkah POS - Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2"></script>
<script src="auth.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f6f6f6;margin:0}.box{max-width:460px;margin:8vh auto;background:#fff;border:1px solid #bbb;padding:22px}label{display:block;font-weight:700;margin:12px 0 4px}input,button{width:100%;padding:12px;box-sizing:border-box;font:inherit}button{margin-top:16px;background:#111;color:#fff;border:0;font-weight:700}button:disabled{opacity:.5}.status{white-space:pre-wrap;margin-top:14px;padding:10px;border:1px solid #aaa}.bad{border-color:#c5221f}.ok{border-color:#188038}
</style>
</head>
<body>
<div class="box">
  <h1>Reset Password</h1>
  <p>Buat password baru untuk Super Admin.</p>
  <label>Password Baru</label>
  <input id="p1" type="password" autocomplete="new-password">
  <label>Ulangi Password Baru</label>
  <input id="p2" type="password" autocomplete="new-password">
  <button id="save" disabled>SIMPAN PASSWORD BARU</button>
  <div id="status" class="status">Memeriksa link recovery...</div>
</div>
<script>
const c=BTP_AUTH.client();
async function validateSession(session){
  const user=session?.user;
  if(!user){save.disabled=true;return false;}
  if((user.email||'').toLowerCase()!==BTP_AUTH.ALLOWED_EMAIL.toLowerCase()){
    await c.auth.signOut();save.disabled=true;status.textContent='Link recovery bukan untuk akun Super Admin.';status.className='status bad';return false;
  }
  save.disabled=false;status.textContent=`Recovery siap untuk ${user.email}`;status.className='status ok';return true;
}
c.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||event==='SIGNED_IN'||event==='INITIAL_SESSION'){validateSession(session);}});
(async()=>{const {data,error}=await c.auth.getSession();if(error){status.textContent=error.message;status.className='status bad';return;}if(data.session){await validateSession(data.session);}else{status.textContent='Sesi recovery belum tersedia.\nBuka halaman ini dari link reset password terbaru di email.';}})();
save.onclick=async()=>{try{const a=p1.value,b=p2.value;if(a.length<8)throw new Error('Password minimal 8 karakter.');if(a!==b)throw new Error('Kedua password tidak sama.');save.disabled=true;status.textContent='Menyimpan password baru...';await BTP_AUTH.updatePassword(a);status.textContent='Password berhasil diganti. Mengarahkan ke login...';status.className='status ok';await c.auth.signOut();setTimeout(()=>location.replace('login.html'),1200);}catch(e){status.textContent=`Reset gagal: ${e.message}`;status.className='status bad';save.disabled=false;}};
</script>
</body>
</html>
