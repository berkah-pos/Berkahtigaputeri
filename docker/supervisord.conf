[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
