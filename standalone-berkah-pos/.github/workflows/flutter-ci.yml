name: Flutter CI
on:
  push:
    paths:
      - "standalone-berkah-pos/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "standalone-berkah-pos/**"
      - ".github/workflows/flutter-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: standalone-berkah-pos
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
