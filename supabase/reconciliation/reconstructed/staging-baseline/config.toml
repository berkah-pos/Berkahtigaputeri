# Disposable-only Supabase config for the reconstructed staging baseline CI job.
# This project is not linked to staging, staging-clone, or production; contains no secrets.
project_id = "berkah-pos-reconstructed-staging-replay"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600

[experimental.pgdelta]
enabled = false
